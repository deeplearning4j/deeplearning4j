name: Java Hotfix Release

# This workflow deploys Java-only modules that do NOT require native (C++) library rebuilds.
# Use this for hotfix releases when changes are limited to pure-Java code, such as:
#   - New model architecture handlers (GGUF architectures, tokenizer fixes)
#   - LLM generation framework updates (sampling, decode loops, pipeline logic)
#   - GGUF format parsing, quantization type support
#   - API-level bug fixes in nd4j-api or nd4j-common
#
# The native backend libraries (nd4j-native, nd4j-cuda-*) and the native SDX binding
# (nd4j-sdx) are NOT rebuilt or deployed. The SDX model, preset, and optional provider
# jars are Java-only and are safe to publish here; consumers still need a compatible
# native backend/binding for execution.

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g., 1.0.0-M3.1)'
        required: true
        default: 1.0.0-M3.1

      snapshotVersion:
        description: 'Next snapshot version (must end with -SNAPSHOT)'
        required: true
        default: 1.0.0-SNAPSHOT

      serverId:
        description: 'Server id to publish to'
        required: false
        default: central

      deployToReleaseStaging:
        description: 'Whether to deploy to release staging (1) or snapshots (0)'
        required: false
        default: 1

      dryRun:
        description: 'Dry run - build but do not deploy (true/false)'
        required: false
        default: 'true'

      regenerateOps:
        description: 'Regenerate op APIs on Actions and retain the patch (dryRun=true only)'
        required: false
        default: 'false'

  workflow_call:
    inputs:
      releaseVersion:
        description: Release version or current snapshot version.
        required: true
        type: string
      snapshotVersion:
        description: Snapshot version ending in -SNAPSHOT.
        required: true
        type: string
      serverId:
        description: Maven server id configured by setup-java.
        required: false
        default: central
        type: string
      deployToReleaseStaging:
        description: Deploy to release staging (1) or snapshots (0).
        required: false
        default: '0'
        type: string
      dryRun:
        description: Build without deploying.
        required: false
        default: 'true'
        type: string
      regenerateOps:
        description: Regenerate op APIs for build-only qualification; never publish generated changes.
        required: false
        default: 'false'
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false
      CENTRAL_SONATYPE_TOKEN_USERNAME:
        required: false
      CENTRAL_SONATYPE_TOKEN_PASSWORD:
        required: false

jobs:
  java-hotfix-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.releaseVersion }}
      SNAPSHOT_VERSION: ${{ inputs.snapshotVersion }}
      DEPLOY_TO_RELEASE_STAGING: ${{ inputs.deployToReleaseStaging }}
      DRY_RUN: ${{ inputs.dryRun }}
      REGENERATE_OPS: ${{ inputs.regenerateOps || 'false' }}
      SERVER_ID: ${{ inputs.serverId }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate publication inputs and credentials
        shell: bash
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          [[ "${SNAPSHOT_VERSION}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*-SNAPSHOT$ ]] || { echo 'snapshotVersion must end with -SNAPSHOT' >&2; exit 2; }
          [[ "${DEPLOY_TO_RELEASE_STAGING}" =~ ^[01]$ ]] || { echo 'deployToReleaseStaging must be 0 or 1' >&2; exit 2; }
          [[ "${DRY_RUN}" =~ ^(true|false)$ ]] || { echo 'dryRun must be true or false' >&2; exit 2; }
          [[ "${REGENERATE_OPS}" =~ ^(true|false)$ ]] || { echo 'regenerateOps must be true or false' >&2; exit 2; }
          if [[ "${REGENERATE_OPS}" == true && "${DRY_RUN}" != true ]]; then
            echo 'regenerateOps requires dryRun=true; generated changes must be reviewed before publication' >&2
            exit 2
          fi
          [[ "${SERVER_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'serverId must be a valid Maven server id' >&2; exit 2; }
          if [[ "${DEPLOY_TO_RELEASE_STAGING}" == 1 ]]; then
            [[ "${RELEASE_VERSION}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ && "${RELEASE_VERSION}" != *-SNAPSHOT ]] || { echo 'releaseVersion must be a valid non-SNAPSHOT version' >&2; exit 2; }
          fi
          if [[ "${DRY_RUN}" == false ]]; then
            required_secrets=(CENTRAL_SONATYPE_TOKEN_USERNAME CENTRAL_SONATYPE_TOKEN_PASSWORD)
            if [[ "${DEPLOY_TO_RELEASE_STAGING}" == 1 ]]; then
              required_secrets+=(GPG_PRIVATE_KEY GPG_PASSPHRASE)
            fi
            for secret in "${required_secrets[@]}"; do
              if [[ -z "${!secret}" ]]; then
                printf 'Missing required publication secret: %s\n' "${secret}" >&2
                exit 2
              fi
            done
          fi

      - name: Check publication safety contracts
        shell: bash
        working-directory: platform-tests
        run: |
          set -Eeuo pipefail
          PYTHONPATH=.. python3 -m unittest test_release_publication_safety 2>&1 | tee ../release-safety-contracts.log

      - name: Set up Java for publishing
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          server-id: ${{ inputs.serverId }}
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ inputs.deployToReleaseStaging == '1' && inputs.dryRun == 'false' && secrets.GPG_PRIVATE_KEY || '' }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: 'maven'

      - name: Regenerate op APIs for build-only qualification
        if: ${{ inputs.regenerateOps == 'true' && inputs.dryRun == 'true' }}
        shell: bash
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          set -Eeuo pipefail
          [[ "${DRY_RUN}" == true && "${REGENERATE_OPS}" == true ]] || exit 2
          git rev-parse HEAD > op-codegen-source.sha
          # Bootstrap only the Java generator and its Java dependencies at the source version.
          # The next build still checks all generated output with strict central-release Javadoc.
          mvn --no-transfer-progress --batch-mode -pl :op-codegen --also-make install \
            -DskipTests -Dmaven.test.skip=true -Dsamediff.native.tests=false \
            -DskipTestResourceEnforcement=true -Denforcer.skip \
            -Dcentral.publishing.autoPublish=false 2>&1 | tee op-codegen-bootstrap.log
          mvn --no-transfer-progress --batch-mode -f codegen/op-codegen/pom.xml \
            org.codehaus.mojo:exec-maven-plugin:3.3.0:java \
            -Dexec.mainClass=org.nd4j.codegen.cli.CLI \
            "-Dexec.args=-dir ${GITHUB_WORKSPACE} -namespaces all -projects all" \
            2>&1 | tee op-codegen-generation.log
          # Include newly generated source files as well as updates in the review patch.
          git add --intent-to-add -- nd4j/nd4j-backends/nd4j-api-parent/nd4j-api/src/main/java
          git diff --check
          git diff --binary -- nd4j/nd4j-backends/nd4j-api-parent/nd4j-api/src/main/java > op-codegen.patch
          git diff --stat

      - name: Retain generated source patch for review
        if: ${{ always() && inputs.regenerateOps == 'true' && inputs.dryRun == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: op-codegen-${{ github.sha }}
          path: |
            op-codegen-source.sha
            op-codegen.patch
            op-codegen-bootstrap.log
            op-codegen-generation.log
          if-no-files-found: error

      - name: Set the requested publication version
        shell: bash
        run: |
          set -Eeuo pipefail
          effective_version="${SNAPSHOT_VERSION}"
          if [[ "${DEPLOY_TO_RELEASE_STAGING}" == 1 ]]; then
            effective_version="${RELEASE_VERSION}"
          fi
          bash ./update-versions.sh "${SNAPSHOT_VERSION}" "${effective_version}"

      - name: Build and deploy Java-only modules
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: -Xmx2g
        run: |
          set -Eeuo pipefail
          # Build the complete Java reactor, including DataVec, DL4J, shaded
          # dependencies and parent POMs, rather than a small hotfix allowlist.
          # Native modules are profile-gated in the root pom and stay inactive
          # here; backend profiles are never activated. No exclusion lists, so
          # newly added Java subtrees are published automatically.
          DEPLOY_CMD=(mvn --no-transfer-progress --batch-mode
            -Psdx
            -DskipTests -Dmaven.test.skip=true -Dsamediff.native.tests=false -DskipTestResourceEnforcement=true
            -Denforcer.skip -Dcentral.publishing.autoPublish=false
            "-Dcentral.publishing.publishingRepositoryId=${SERVER_ID}")

          if [[ "${DRY_RUN}" == true ]]; then
            echo "=== DRY RUN: building but not deploying ==="
            DEPLOY_CMD+=(install)
          else
            DEPLOY_CMD+=(deploy)
          fi

          if [[ "${DEPLOY_TO_RELEASE_STAGING}" == 1 ]]; then
            DEPLOY_CMD+=(-Pcentral-release)
            if [[ "${DRY_RUN}" == false ]]; then
              DEPLOY_CMD+=(-Pcentral-signing)
            fi
          fi

          printf 'Running:'
          printf ' %q' "${DEPLOY_CMD[@]}"
          printf '\n'
          "${DEPLOY_CMD[@]}" 2>&1 | tee java-release-build.log

      - name: Verify built artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Verifying built artifacts ==="
          effective_version="${SNAPSHOT_VERSION}"
          suffixes=(.jar)
          if [[ "${DEPLOY_TO_RELEASE_STAGING}" == 1 ]]; then
            effective_version="${RELEASE_VERSION}"
            suffixes+=(-sources.jar -javadoc.jar)
          fi
          # Sentinel modules from every Java subtree; the reactor build itself
          # fails when any selected module is missing, so this guards against a
          # silently narrowed module list or wrong publication version.
          modules=(
            nd4j/nd4j-shade/jackson nd4j/nd4j-common
            nd4j/nd4j-backends/nd4j-api-parent/nd4j-api
            nd4j/nd4j-backends/nd4j-api-parent/nd4j-native-api
            nd4j/nd4j-serde/nd4j-arrow nd4j/nd4j-ggml
            nd4j/nd4j-backends/nd4j-backend-impls/nd4j-sdx-preset
            nd4j/nd4j-backends/nd4j-backend-impls/nd4j-sdx-model
            nd4j/nd4j-backends/nd4j-backend-impls/nd4j-sdx-litertlm
            nd4j/samediff-llm nd4j/samediff-vlm nd4j/samediff-audio
            nd4j/samediff-pipeline-ggml datavec/datavec-api
            deeplearning4j/deeplearning4j-nn deeplearning4j/deeplearning4j-core
            deeplearning4j/deeplearning4j-modelimport
            deeplearning4j/deeplearning4j-ui-parent/deeplearning4j-ui omnihub
            codegen/op-codegen resources
          )
          for path in "${modules[@]}"; do
            module="${path##*/}"
            archive=$(find "${path}" -type f -path "*/target/${module}-${effective_version}.jar" -print)
            if [[ -z "${archive}" || ! -s "${archive}" ]]; then
              printf 'Missing or ambiguous built artifact: %s (%s-%s%s)\n' "${path}" "${module}" "${effective_version}" "${suffixes[0]}" >&2
              exit 1
            fi
            printf 'OK: %s\n' "${archive}"
          done

      - name: Retain Java qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-release-qualification-${{ github.sha }}
          path: |
            release-safety-contracts.log
            java-release-build.log
          if-no-files-found: warn
