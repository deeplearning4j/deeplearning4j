name: Java Hotfix Release

# This workflow deploys Java-only modules that do NOT require native (C++) library rebuilds.
# Use this for hotfix releases when changes are limited to pure-Java code, such as:
#   - New model architecture handlers (GGUF architectures, tokenizer fixes)
#   - LLM generation framework updates (sampling, decode loops, pipeline logic)
#   - GGUF format parsing, quantization type support
#   - API-level bug fixes in nd4j-api or nd4j-common
#
# The native backend libraries (nd4j-native, nd4j-cuda-*) and the native SDX binding
# (nd4j-sdx) are NOT rebuilt or deployed. The SDX model, preset, and optional provider
# jars are Java-only and are safe to publish here; consumers still need a compatible
# native backend/binding for execution.

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g., 1.0.0-M3.1)'
        required: true
        default: 1.0.0-M3.1

      snapshotVersion:
        description: 'Next snapshot version (must end with -SNAPSHOT)'
        required: true
        default: 1.0.0-SNAPSHOT

      serverId:
        description: 'Server id to publish to'
        required: false
        default: central

      deployToReleaseStaging:
        description: 'Whether to deploy to release staging (1) or snapshots (0)'
        required: false
        default: 1

      dryRun:
        description: 'Dry run - build but do not deploy (true/false)'
        required: false
        default: false

  workflow_call:
    inputs:
      releaseVersion:
        description: Release version or current snapshot version.
        required: true
        type: string
      snapshotVersion:
        description: Snapshot version ending in -SNAPSHOT.
        required: true
        type: string
      serverId:
        description: Maven server id configured by setup-java.
        required: false
        default: central
        type: string
      deployToReleaseStaging:
        description: Deploy to release staging (1) or snapshots (0).
        required: false
        default: '0'
        type: string
      dryRun:
        description: Build without deploying.
        required: false
        default: 'false'
        type: string
    secrets:
      SONATYPE_GPG_KEY:
        required: true
      PACKAGES_GPG_PASS:
        required: true
      CENTRAL_SONATYPE_TOKEN_USERNAME:
        required: true
      CENTRAL_SONATYPE_TOKEN_PASSWORD:
        required: true

jobs:
  java-hotfix-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java for publishing
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          server-id: ${{ inputs.serverId }}
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.SONATYPE_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: 'maven'

      - name: Validate inputs
        shell: bash
        run: |
          if [[ "${{ inputs.snapshotVersion }}" != *-SNAPSHOT ]]; then
            echo "Error: snapshotVersion must end with -SNAPSHOT"
            exit 1
          fi
          echo "Release version: ${{ inputs.releaseVersion }}"
          echo "Snapshot version: ${{ inputs.snapshotVersion }}"
          echo "Deploy to release staging: ${{ inputs.deployToReleaseStaging }}"
          echo "Dry run: ${{ inputs.dryRun }}"

      - name: Update versions for release
        if: inputs.deployToReleaseStaging == '1'
        shell: bash
        run: |
          bash ./update-versions.sh "${{ inputs.snapshotVersion }}" "${{ inputs.releaseVersion }}"

      - name: Build and deploy Java-only modules
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASS }}
          MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: -Xmx2g
        run: |
          # These are the Java-only modules that can be released without native rebuilds.
          # Order matters: nd4j-common and nd4j-api are dependencies of the others.
          # SDX is explicitly opted into because its model/preset/LiteRT-LM jars are
          # independent of the native nd4j-sdx binding build.
          MODULES=":nd4j-common,:nd4j-api,:nd4j-ggml,:nd4j-sdx-preset,:nd4j-sdx-model,:nd4j-sdx-litertlm,:samediff-llm,:samediff-pipeline-ggml,:samediff-audio"

          DEPLOY_CMD="mvn --no-transfer-progress --batch-mode"
          DEPLOY_CMD="${DEPLOY_CMD} -Psdx -pl ${MODULES} --also-make"
          DEPLOY_CMD="${DEPLOY_CMD} -DskipTests -Dmaven.test.skip=true -Dsamediff.native.tests=false -DskipTestResourceEnforcement=true"
          DEPLOY_CMD="${DEPLOY_CMD} -Dmaven.javadoc.failOnError=false"
          DEPLOY_CMD="${DEPLOY_CMD} -Denforcer.skip"

          if [ "${{ inputs.dryRun }}" == "true" ]; then
            echo "=== DRY RUN: building but not deploying ==="
            DEPLOY_CMD="${DEPLOY_CMD} install"
          else
            DEPLOY_CMD="${DEPLOY_CMD} deploy"
          fi

          if [ "${{ inputs.deployToReleaseStaging }}" == "1" ]; then
            DEPLOY_CMD="${DEPLOY_CMD} -Prelease -Dlocal.software.repository=sonatype"
          fi

          echo "Running: ${DEPLOY_CMD}"
          eval "${DEPLOY_CMD}"

      - name: Verify deployed artifacts
        shell: bash
        run: |
          echo "=== Verifying built artifacts ==="
          for module in nd4j-common nd4j-api nd4j-ggml nd4j-sdx-preset nd4j-sdx-model nd4j-sdx-litertlm samediff-llm samediff-pipeline-ggml samediff-audio; do
            JAR=$(find . -path "*/${module}/target/${module}-*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" -not -name "*-tests.jar" | head -1)
            if [ -n "${JAR}" ]; then
              echo "OK: ${module} -> $(basename ${JAR}) ($(du -h ${JAR} | cut -f1))"
            else
              echo "WARNING: No JAR found for ${module}"
            fi
          done
