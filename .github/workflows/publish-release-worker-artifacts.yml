name: Publish staged release worker artifacts

on:
  workflow_call:
    inputs:
      fullRepository:
        type: boolean
        default: false
      metadataFixCommit:
        type: string
        default: ""
      snapshotVersion:
        type: string
        default: 1.0.0-SNAPSHOT
      sourceRunId:
        description: GitHub Actions run ID containing release-worker-* artifacts.
        required: true
        type: string
      artifactPattern:
        description: Glob selecting staged worker artifacts from the source run.
        required: false
        default: release-worker-*
        type: string
      deployToReleaseStaging:
        description: Stage a non-SNAPSHOT release (1) or publish a snapshot (0).
        required: false
        default: "0"
        type: string
      dryRun:
        description: Merge and verify without publishing.
        required: false
        default: "false"
        type: string
    secrets:
      CENTRAL_SONATYPE_TOKEN_USERNAME:
        required: false
      CENTRAL_SONATYPE_TOKEN_PASSWORD:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false
  workflow_dispatch:
    inputs:
      fullRepository:
        description: Assemble the canonical native matrix and original Java reactor
        type: boolean
        default: false
      metadataFixCommit:
        description: Explicit immutable packaging-only fix SHA
        type: string
        default: ""
      snapshotVersion:
        description: Original source snapshot version
        type: string
        default: 1.0.0-SNAPSHOT
      sourceRunId:
        description: GitHub Actions run ID containing release-worker-* artifacts.
        required: true
        type: string
      artifactPattern:
        description: Glob selecting staged worker artifacts from the source run.
        required: false
        default: release-worker-*
        type: string
      deployToReleaseStaging:
        description: Stage a non-SNAPSHOT release (1) or publish a snapshot (0).
        required: true
        default: "0"
        type: choice
        options: ["0", "1"]
      dryRun:
        description: Merge and verify without publishing.
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  actions: read
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      artifacts: ${{ steps.artifacts.outputs.artifacts }}
      source-attempt: ${{ steps.artifacts.outputs.source-attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate publication credentials before downloading workers
        shell: bash
        env:
          DEPLOY_TO_RELEASE_STAGING: ${{ inputs.deployToReleaseStaging }}
          DRY_RUN: ${{ inputs.dryRun }}
          FULL_REPOSITORY: ${{ inputs.fullRepository }}
          METADATA_FIX_COMMIT: ${{ inputs.metadataFixCommit }}
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          [[ "${DEPLOY_TO_RELEASE_STAGING}" =~ ^[01]$ ]] || { echo 'deployToReleaseStaging must be 0 or 1' >&2; exit 2; }
          [[ "${DRY_RUN}" =~ ^(true|false)$ ]] || { echo 'dryRun must be true or false' >&2; exit 2; }
          if [[ -n "${METADATA_FIX_COMMIT:-}" ]]; then
            [[ "${FULL_REPOSITORY:-false}" == true && "$METADATA_FIX_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
              printf 'Metadata repair requires full repository recovery and an immutable fix SHA\n' >&2; exit 2;
            }
          fi
          if [[ "${DRY_RUN}" == false ]]; then
            required_secrets=(CENTRAL_SONATYPE_TOKEN_USERNAME CENTRAL_SONATYPE_TOKEN_PASSWORD)
            if [[ "${DEPLOY_TO_RELEASE_STAGING}" == 1 ]]; then
              required_secrets+=(GPG_PRIVATE_KEY GPG_PASSPHRASE)
            fi
            for secret in "${required_secrets[@]}"; do
              if [[ -z "${!secret}" ]]; then
                printf 'Missing required publication secret: %s\n' "${secret}" >&2
                exit 2
              fi
            done
          fi
      - name: Resolve staged worker artifacts
        id: artifacts
        uses: actions/github-script@v9
        env:
          SOURCE_RUN_ID: ${{ inputs.sourceRunId }}
          ARTIFACT_PATTERN: ${{ inputs.artifactPattern }}
        with:
          script: |
            const runId = Number.parseInt(process.env.SOURCE_RUN_ID, 10);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`Invalid source run ID: ${process.env.SOURCE_RUN_ID}`);
              return;
            }
            const sourceRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
            });
            if (sourceRun.data.status !== 'completed') {
              core.setFailed('Recovery requires a completed source workflow run');
              return;
            }
            core.setOutput('source-attempt', String(sourceRun.data.run_attempt));
            const pattern = process.env.ARTIFACT_PATTERN || 'release-worker-*';
            const escaped = pattern
              .replace(/[.+^${}()|[\]\\]/g, '\\$&')
              .replaceAll('*', '.*')
              .replaceAll('?', '.');
            const matcher = new RegExp(`^${escaped}$`);
            const [artifacts, jobs] = await Promise.all([
              github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                  per_page: 100,
                },
              ),
              github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                  per_page: 100,
                },
              ),
            ]);
            const candidates = artifacts
              .filter((artifact) => !artifact.expired && matcher.test(artifact.name))
              .sort((left, right) => left.name.localeCompare(right.name));
            const rows = [];
            for (const artifact of candidates) {
              const artifactId = artifact.name.replace(/^release-worker-/, '');
              const sourceJob = jobs.find((job) => job.name.endsWith(` / ${artifactId}`));
              const workerStep = sourceJob?.steps?.find((step) => step.name === 'Run worker');
              const uploadStep = sourceJob?.steps?.find(
                (step) => step.name === 'Upload staged worker result',
              );
              if (
                sourceJob?.status !== 'completed'
                || workerStep?.conclusion !== 'success'
                || uploadStep?.conclusion !== 'success'
              ) {
                core.warning(
                  `Skipping ${artifact.name}: no completed source job with successful `
                  + 'Run worker and artifact upload steps.',
                );
                continue;
              }
              rows.push({
                name: artifact.name,
                sourceJobId: String(sourceJob.id),
                sourceSha: sourceJob.head_sha,
              });
            }
            if (rows.length === 0) {
              core.setFailed(
                `No verified successful artifacts matching ${pattern} were found in run ${runId}`,
              );
              return;
            }
            core.info(
              `Publishing ${rows.length} verified staged worker artifact(s) from run ${runId}`,
            );
            core.setOutput('artifacts', JSON.stringify(rows));

  publish:
    needs: matrix
    name: publish / merged staged Maven repository
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Download staged worker artifact
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifactPattern }}
          path: ${{ github.workspace }}/.release-worker-recovery
          merge-multiple: false
          run-id: ${{ inputs.sourceRunId }}
          github-token: ${{ github.token }}
      - name: Inspect staged worker artifact
        id: staged
        shell: bash
        env:
          VERIFIED_ARTIFACTS: ${{ needs.matrix.outputs.artifacts }}
          DEPLOY_TO_RELEASE_STAGING: ${{ inputs.deployToReleaseStaging }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          set -Eeuo pipefail
          artifact_root="${GITHUB_WORKSPACE}/.release-worker-recovery"
          mapfile -t verified_artifacts < <(
            python3 -c 'import json,sys; print("\n".join(item["name"] for item in json.loads(sys.argv[1])))' \
              "${VERIFIED_ARTIFACTS}"
          )
          if [ "${#verified_artifacts[@]}" -eq 0 ]; then
            printf 'No verified staged worker artifacts were resolved.\n' >&2
            exit 1
          fi
          release_version=""
          source_commit=""
          for artifact_name in "${verified_artifacts[@]}"; do
            worker_root="${artifact_root}/${artifact_name}"
            if [ ! -f "${worker_root}/worker-config.json" ] &&
               [ "${#verified_artifacts[@]}" -eq 1 ] &&
               [ -f "${artifact_root}/worker-config.json" ]; then
              worker_root="${artifact_root}"
            fi
            expected_commit=$(python3 -c \
              'import json,sys; print(next(item["sourceSha"] for item in json.loads(sys.argv[1]) if item["name"] == sys.argv[2]))' \
              "${VERIFIED_ARTIFACTS}" "${artifact_name}")
            if [ ! -f "${worker_root}/worker-success" ]; then
              printf 'Verified worker artifact is incomplete: %s\n' "${artifact_name}" >&2
              exit 1
            fi
            if [ ! -d "${worker_root}/maven-repository" ]; then
              printf 'Verified worker artifact is missing its Maven repository: %s\n' \
                "${artifact_name}" >&2
              exit 1
            fi
            current_version=$(python3 release/github/prepare-worker.py release-version \
              --config "${worker_root}/worker-config.json")
            python3 -c \
              'import re,sys; raise SystemExit(0 if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", sys.argv[1]) else 1)' \
              "${current_version}" || {
                printf 'Invalid Maven version: %s\n' "${current_version}" >&2
                exit 1
              }
            current_commit=$(python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["commit"])' \
              "${worker_root}/worker-config.json")
            if [ "${current_commit}" != "${expected_commit}" ]; then
              printf 'Worker source commit mismatch for %s: expected %s, got %s\n' \
                "${artifact_name}" "${expected_commit}" "${current_commit}" >&2
              exit 1
            fi
            if [ -z "${release_version}" ]; then
              release_version="${current_version}"
              source_commit="${current_commit}"
            elif [ "${release_version}" != "${current_version}" ]; then
              printf 'Staged workers disagree on release version: %s vs %s\n' \
                "${release_version}" "${current_version}" >&2
              exit 1
            elif [ "${source_commit}" != "${current_commit}" ]; then
              printf 'Staged workers disagree on source commit: %s vs %s\n' \
                "${source_commit}" "${current_commit}" >&2
              exit 1
            fi
          done
          if ! [[ "${source_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Invalid staged source commit: %s\n' "${source_commit}" >&2
            exit 1
          fi
          case "${DEPLOY_TO_RELEASE_STAGING}" in
            0)
              publication_mode=snapshot
              if [[ "${release_version}" != *-SNAPSHOT ]]; then
                printf 'Snapshot recovery requires a -SNAPSHOT artifact version: %s\n' \
                  "${release_version}" >&2
                exit 2
              fi
              ;;
            1)
              publication_mode=release
              if [[ "${release_version}" == *-SNAPSHOT ]]; then
                printf 'Release recovery requires a non-SNAPSHOT artifact version: %s\n' \
                  "${release_version}" >&2
                exit 2
              fi
              ;;
            *)
              printf 'deployToReleaseStaging must be 0 or 1: %s\n' \
                "${DEPLOY_TO_RELEASE_STAGING}" >&2
              exit 2
              ;;
          esac
          case "${DRY_RUN}" in
            false) publish=true ;;
            true) publish=false ;;
            *)
              printf 'dryRun must be true or false: %s\n' "${DRY_RUN}" >&2
              exit 2
              ;;
          esac
          printf 'release-version=%s\n' "${release_version}" >>"${GITHUB_OUTPUT}"
          printf 'source-commit=%s\n' "${source_commit}" >>"${GITHUB_OUTPUT}"
          printf 'publication-mode=%s\n' "${publication_mode}" >>"${GITHUB_OUTPUT}"
          printf 'publish=%s\n' "${publish}" >>"${GITHUB_OUTPUT}"
      - name: Checkout immutable source for full repository recovery
        if: inputs.fullRepository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.staged.outputs['source-commit'] }}
          path: .release-source
          persist-credentials: false
      - name: Checkout explicit packaging fix
        if: inputs.fullRepository && inputs.metadataFixCommit != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.metadataFixCommit }}
          path: .release-metadata-fix
          persist-credentials: false
      - name: Configure Java for full repository recovery
        if: inputs.fullRepository
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Assemble and verify full repository from original worker receipts
        if: inputs.fullRepository
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.staged.outputs['release-version'] }}
          SOURCE_COMMIT: ${{ steps.staged.outputs['source-commit'] }}
          SNAPSHOT_VERSION: ${{ inputs.snapshotVersion }}
          SOURCE_RUN_ID: ${{ inputs.sourceRunId }}
          SOURCE_ATTEMPT: ${{ needs.matrix.outputs.source-attempt }}
          METADATA_FIX_COMMIT: ${{ inputs.metadataFixCommit }}
        run: |
          set -Eeuo pipefail
          metadata_args=()
          if [[ -n "$METADATA_FIX_COMMIT" ]]; then
            metadata_args+=(--metadata-fix-source "${GITHUB_WORKSPACE}/.release-metadata-fix"
              --metadata-fix-commit "$METADATA_FIX_COMMIT")
          fi
          python3 release/github/full-repository.py \
            --workers "${GITHUB_WORKSPACE}/.release-worker-recovery" \
            --source "${GITHUB_WORKSPACE}/.release-source" \
            --local-repository "${GITHUB_WORKSPACE}/.release-assembly-m2" \
            --output "${GITHUB_WORKSPACE}/.release-worker-recovery-merged" \
            --release-version "$RELEASE_VERSION" --snapshot-version "$SNAPSHOT_VERSION" \
            --commit "$SOURCE_COMMIT" --run-id "github-${SOURCE_RUN_ID}-${SOURCE_ATTEMPT}" \
            "${metadata_args[@]}" 2>&1 | tee "${RUNNER_TEMP}/full-repository-recovery.log"
      - name: Merge and verify staged Maven repository
        if: ${{ !inputs.fullRepository }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.staged.outputs['release-version'] }}
          SOURCE_COMMIT: ${{ steps.staged.outputs['source-commit'] }}
        run: |
          set -Eeuo pipefail
          artifact_root="${GITHUB_WORKSPACE}/.release-worker-recovery"
          merged_root="${GITHUB_WORKSPACE}/.release-worker-recovery-merged"
          merged_repository="${merged_root}/maven-repository"
          merged_manifest="${merged_root}/repository-manifest.json"
          rm -rf "${merged_root}"
          mkdir -p "${merged_root}"
          merge_command=(python3 release/central/repository.py merge
            --output "${merged_repository}"
            --manifest "${merged_manifest}"
            --release-version "${RELEASE_VERSION}"
            --commit "${SOURCE_COMMIT}")
          # A release must not silently choose between conflicting POMs or binaries.
          if [[ "${RELEASE_VERSION}" == *-SNAPSHOT ]]; then
            merge_command+=(--allow-unclassified-duplicates)
          fi
          repository_count=0
          while IFS= read -r repository; do
            merge_command+=(--input "${repository}")
            repository_count=$((repository_count + 1))
          done < <(find "${artifact_root}" -type d -name maven-repository | sort)
          if [ "${repository_count}" -eq 0 ]; then
            printf 'No staged Maven repositories were found.\n' >&2
            exit 1
          fi
          "${merge_command[@]}"
          metadata_args=()
          if [[ "${RELEASE_VERSION}" != *-SNAPSHOT ]]; then
            metadata_args+=(--release-metadata)
          fi
          python3 release/central/repository.py verify \
            --repository "${merged_repository}" \
            --manifest "${merged_manifest}" \
            --release-version "${RELEASE_VERSION}" \
            --commit "${SOURCE_COMMIT}" "${metadata_args[@]}"
      - name: Configure Maven Central snapshots
        if: ${{ steps.staged.outputs.publish == 'true' && steps.staged.outputs['publication-mode'] == 'snapshot' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          server-id: central-portal-snapshots
          server-username: CENTRAL_SONATYPE_TOKEN_USERNAME
          server-password: CENTRAL_SONATYPE_TOKEN_PASSWORD
      - name: Publish merged staged Maven snapshot
        if: ${{ steps.staged.outputs.publish == 'true' && steps.staged.outputs['publication-mode'] == 'snapshot' }}
        shell: bash
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          RELEASE_VERSION: ${{ steps.staged.outputs['release-version'] }}
        run: |
          set -Eeuo pipefail
          python3 release/central/repository.py deploy-snapshot \
            --repository "${GITHUB_WORKSPACE}/.release-worker-recovery-merged/maven-repository" \
            --release-version "${RELEASE_VERSION}" \
            --repository-id central-portal-snapshots \
            --url https://central.sonatype.com/repository/maven-snapshots/ \
            --maven-executable mvn
      - name: Configure Maven Central release signing
        if: ${{ steps.staged.outputs.publish == 'true' && steps.staged.outputs['publication-mode'] == 'release' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          server-id: central
          server-username: CENTRAL_SONATYPE_TOKEN_USERNAME
          server-password: CENTRAL_SONATYPE_TOKEN_PASSWORD
      - name: Stage merged Maven release in Central Portal
        if: ${{ steps.staged.outputs.publish == 'true' && steps.staged.outputs['publication-mode'] == 'release' }}
        shell: bash
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          merged_root="${GITHUB_WORKSPACE}/.release-worker-recovery-merged"
          python3 release/central/repository.py sign-bundle \
            --repository "${merged_root}/maven-repository" \
            --output "${merged_root}/central-bundle.zip"
          python3 release/central/repository.py upload \
            --bundle "${merged_root}/central-bundle.zip" \
            --wait-seconds 5400 | tee "${merged_root}/central-deployment.log"
      - name: Retain merged Maven repository for build-only inspection
        if: ${{ always() && steps.staged.outputs.publish == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: recovered-merged-maven-repository-${{ steps.staged.outputs['release-version'] }}
          path: ${{ github.workspace }}/.release-worker-recovery-merged/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovered-maven-publication-${{ steps.staged.outputs['release-version'] }}
          path: |
            ${{ github.workspace }}/.release-worker-recovery-merged/repository-manifest.json
            ${{ github.workspace }}/.release-worker-recovery-merged/repository-manifest.json.sha256
            ${{ github.workspace }}/.release-worker-recovery-merged/central-deployment.log
            ${{ github.workspace }}/.release-worker-recovery-merged/metadata-recovery-provenance.json
            ${{ github.workspace }}/.release-worker-recovery-merged/*effective-pom.xml
            ${{ github.workspace }}/.release-worker-recovery-merged/consumers/
            ${{ runner.temp }}/full-repository-recovery.log
          if-no-files-found: warn
          retention-days: 90
