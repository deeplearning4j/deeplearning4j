name: GPU Sanity Tests

on:
  workflow_dispatch:
    inputs:
      testFilter:
        description: 'Surefire -Dtest filter (e.g. SameDiffTests#testLinearModule). Empty = default sanity set.'
        required: false
        default: ''

      runsOn:
        description: 'Self-hosted runner label with GPU'
        required: true
        default: self-hosted

jobs:
  gpu-sanity:
    runs-on: ${{ github.event.inputs.runsOn }}
    timeout-minutes: 120
    name: cuda-12.9

    steps:
      - uses: AutoModality/action-clean@v1
      - uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven snapshot repository
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS'
          <settings>
            <profiles>
              <profile>
                <id>sonatype-snapshots</id>
                <repositories>
                  <repository>
                    <id>central-portal-snapshots</id>
                    <name>Central Portal Snapshots</name>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled><updatePolicy>always</updatePolicy></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>sonatype-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          SETTINGS

      - name: Build Java modules from source (native jars from snapshots)
        shell: bash
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          mvn install -DskipTests -DskipTestResourceEnforcement=true \
              -Dmaven.javadoc.skip=true \
              -pl :platform-tests --also-make \
              -pl !:libnd4j \
              --no-transfer-progress --batch-mode

      - uses: ./.github/actions/download-dl4j-test-resources-linux

      - name: Run GPU sanity tests
        shell: bash
        env:
          MAVEN_OPTS: -Xmx2g
          CUDA_LAUNCH_BLOCKING: 1
        run: |
          TEST_FILTER="${{ github.event.inputs.testFilter }}"
          if [ -n "$TEST_FILTER" ]; then
            TEST_FLAGS="-Dtest=${TEST_FILTER}"
          else
            TEST_FLAGS="-Dtest=SameDiffTests,SameDiffTrainingTest,BasicOpValidationTests,CustomOpsTests"
          fi
          cd platform-tests
          # NOTE: the pom binds surefire excludedGroups to ${excludedTests} and the forked-JVM
          # OMP_NUM_THREADS to ${omp.num.threads} — shell exports / -DexcludedGroups are no-ops here.
          mvn test \
              -Dtest.heap.size=8g -Dtest.offheap.size=16g \
              -Domp.num.threads=1 \
              -DskipTestResourceEnforcement=true \
              -DexcludedTests="long-running-test,large-resources,downloads" \
              ${TEST_FLAGS} \
              --no-transfer-progress --batch-mode --fail-at-end

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-gpu-sanity
          path: platform-tests/target/surefire-reports/
          retention-days: 14
