name: Build cross-platform Java modules

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Canonical release workflow matrix to execute.
        required: false
        default: build-deploy-cross-platform.yml
      commitId:
        description: Source commit or ref. Empty uses the triggering commit.
        required: false
        default: ""
      runsOn:
        description: Optional runner label override.
        required: false
        default: ""
      buildThreads:
        description: Optional native build thread override.
        required: false
        default: ""
      mvnFlags:
        description: Additional Maven flags passed to the shared worker.
        required: false
        default: ""
      classifiers:
        description: Comma-separated exact shard--variant names; requires targetedRetry=1.
        required: false
        default: ""
      targetedRetry:
        description: Explicitly run only the classifiers above instead of the complete matrix.
        required: true
        type: choice
        options: ["0", "1"]
        default: "0"
      libnd4jUrl:
        description: Optional prebuilt libnd4j archive URL.
        required: false
        default: ""
      buildAot:
        description: Build GraalVM AOT artifacts for the base variant.
        required: true
        type: choice
        options: ["0", "1"]
        default: "0"
      aotAllSpins:
        description: Build AOT artifacts for every selected classifier.
        required: true
        type: choice
        options: ["0", "1"]
        default: "0"
      publishSourceRunId:
        description: Publish staged release-worker artifacts from this run ID without rebuilding.
        required: false
        default: ""
      publishArtifactPattern:
        description: Glob selecting staged worker artifacts when publishSourceRunId is set.
        required: false
        default: release-worker-*

permissions:
  actions: read
  contents: read

jobs:
  release:
    if: inputs.publishSourceRunId == ''
    uses: ./.github/workflows/_release-worker.yml
    with:
      workflow: ${{ inputs.workflow }}
      sourceRef: ${{ inputs.commitId || github.sha }}
      runnerOverride: ${{ inputs.runsOn }}
      buildThreads: ${{ inputs.buildThreads }}
      mvnFlags: ${{ inputs.mvnFlags }}
      classifiers: ${{ inputs.classifiers }}
      targetedRetry: ${{ inputs.targetedRetry }}
      libnd4jUrl: ${{ inputs.libnd4jUrl }}
      buildAot: ${{ inputs.buildAot }}
      aotAllSpins: ${{ inputs.aotAllSpins }}
    secrets: inherit

  publish-staged:
    if: inputs.publishSourceRunId != ''
    uses: ./.github/workflows/publish-release-worker-artifacts.yml
    with:
      sourceRunId: ${{ inputs.publishSourceRunId }}
      artifactPattern: ${{ inputs.publishArtifactPattern }}
    secrets: inherit
