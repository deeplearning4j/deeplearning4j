name: Build cross-platform Java modules

on:
  workflow_dispatch:
    inputs:
      cacheMigration:
        description: Azure-to-R2 cache data transfer only; skips all builds and publication.
        type: choice
        options: [none, preview, copy, verify]
        default: none
        required: false
      cacheNamespace:
        description: Migration namespace; compiler and auxiliary are disjoint. Stop any all-namespace run first.
        type: choice
        options: [all, compiler, auxiliary]
        default: all
      workflow:
        description: Canonical release workflow matrix to execute. Use all for the full native and Java repository.
        required: false
        default: build-deploy-cross-platform.yml
      commitId:
        description: Source commit or ref. Empty uses the triggering commit.
        required: false
        default: ""
      runsOn:
        description: Optional runner label override.
        required: false
        default: ""
      buildThreads:
        description: Optional native build thread override.
        required: false
        default: ""
      mvnFlags:
        description: Additional Maven flags passed to the shared worker.
        required: false
        default: ""
      classifiers:
        description: Published classifier IDs; requires targetedRetry=1 and auto-resolves a unique canonical matrix.
        required: false
        default: ""
      targetedRetry:
        description: Explicitly run only the classifiers above instead of the complete matrix.
        required: true
        type: choice
        options: ["0", "1"]
        default: "0"
      libnd4jUrl:
        description: Optional prebuilt libnd4j archive URL.
        required: false
        default: ""
      buildAot:
        description: Build GraalVM AOT artifacts for the base variant.
        required: true
        type: choice
        options: ["0", "1"]
        default: "0"
      aotAllSpins:
        description: Build AOT artifacts for every selected classifier.
        required: true
        type: choice
        options: ["0", "1"]
        default: "0"
      javaOnly:
        description: Publish Java-only modules without running native release workers.
        required: false
        type: choice
        options: ["0", "1"]
        default: "0"
      regenerateOps:
        description: Regenerate op APIs in the Java-only dry run and retain a review patch.
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
      releaseVersion:
        description: Release version when deployToReleaseStaging=1.
        required: false
        default: 1.0.0-M3
      snapshotVersion:
        description: Current snapshot version ending in -SNAPSHOT.
        required: false
        default: 1.0.0-SNAPSHOT
      serverId:
        description: Maven server id configured by setup-java.
        required: false
        default: central
      deployToReleaseStaging:
        description: Deploy to release staging (1) or snapshots (0).
        required: true
        type: choice
        options: ["0", "1"]
        default: "0"
      dryRun:
        description: Build without deploying.
        required: true
        type: choice
        options: ["false", "true"]
        default: "true"
      publishSourceRunId:
        description: Publish staged release-worker artifacts from this run ID without rebuilding.
        required: false
        default: ""
      packagingFixCommit:
        description: Immutable packaging-only fix SHA for full repository recovery; never changes native receipts.
        required: false
        default: ""
      publishArtifactPattern:
        description: Glob selecting staged worker artifacts when publishSourceRunId is set.
        required: false
        default: release-worker-*

permissions:
  actions: read
  contents: read

jobs:
  cache-migration:
    if: inputs.cacheMigration != '' && inputs.cacheMigration != 'none'
    uses: ./.github/workflows/migrate-cache-to-r2.yml
    with:
      mode: ${{ inputs.cacheMigration }}
      namespace: ${{ inputs.cacheNamespace || 'all' }}
    secrets: inherit

  java-only:
    if: inputs.javaOnly == '1' && (inputs.cacheMigration == '' || inputs.cacheMigration == 'none')
    uses: ./.github/workflows/java-hotfix-release.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
      snapshotVersion: ${{ inputs.snapshotVersion }}
      serverId: ${{ inputs.serverId }}
      deployToReleaseStaging: ${{ inputs.deployToReleaseStaging }}
      dryRun: ${{ inputs.dryRun }}
      regenerateOps: ${{ inputs.regenerateOps || 'false' }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
      CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}

  release:
    if: inputs.publishSourceRunId == '' && inputs.javaOnly != '1' && (inputs.cacheMigration == '' || inputs.cacheMigration == 'none')
    uses: ./.github/workflows/_release-worker.yml
    with:
      workflow: ${{ inputs.workflow }}
      sourceRef: ${{ inputs.commitId || github.sha }}
      runnerOverride: ${{ inputs.runsOn }}
      buildThreads: ${{ inputs.buildThreads }}
      mvnFlags: ${{ inputs.mvnFlags }}
      classifiers: ${{ inputs.classifiers }}
      targetedRetry: ${{ inputs.targetedRetry }}
      libnd4jUrl: ${{ inputs.libnd4jUrl }}
      buildAot: ${{ inputs.buildAot }}
      aotAllSpins: ${{ inputs.aotAllSpins }}
      releaseVersion: ${{ inputs.releaseVersion }}
      snapshotVersion: ${{ inputs.snapshotVersion }}
      deployToReleaseStaging: ${{ inputs.deployToReleaseStaging }}
      dryRun: ${{ inputs.dryRun }}
    secrets: inherit

  publish-staged:
    if: inputs.publishSourceRunId != '' && inputs.javaOnly != '1' && (inputs.cacheMigration == '' || inputs.cacheMigration == 'none')
    uses: ./.github/workflows/publish-release-worker-artifacts.yml
    with:
      sourceRunId: ${{ inputs.publishSourceRunId }}
      fullRepository: ${{ inputs.workflow == 'all' }}
      metadataFixCommit: ${{ inputs.packagingFixCommit }}
      snapshotVersion: ${{ inputs.snapshotVersion }}
      artifactPattern: ${{ inputs.publishArtifactPattern }}
      deployToReleaseStaging: ${{ inputs.deployToReleaseStaging }}
      dryRun: ${{ inputs.dryRun }}
    secrets: inherit
