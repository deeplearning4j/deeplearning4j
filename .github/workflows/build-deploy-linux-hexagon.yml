name: Build and Deploy Linux x86_64 Hexagon (hexagon-mlir)

# Build the nd4jhexagon native library and deploy the nd4j-hexagon /
# nd4j-hexagon-preset Java artifacts for the linux-x86_64 platform.
#
# The native build uses chip=hexagon which activates SD_HEXAGON=true in CMake
# via BuildHexagon.cmake.  libhexagon_mlir_runtime.so is NOT a link-time
# dependency — it is loaded at runtime via dlopen() inside
# HexagonRuntimeManager.cpp (all hexagon-mlir types are opaque void*), so the
# build needs no Qualcomm SDK.  hexagon-mlir itself is BSD-3 open source
# (Qualcomm, Dec 2025).
#
# See ADR 0088 and ADR 0102 for Hexagon integration design.

on:
  workflow_dispatch:
    inputs:
      buildThreads:
        description: 'Build threads for libnd4j (controls memory usage)'
        required: true
        default: 4

      deployToReleaseStaging:
        description: 'Whether to deploy to release staging or not.'
        required: false
        default: 0

      releaseVersion:
        description: 'Release version target'
        required: false
        default: 1.0.0-M3

      snapshotVersion:
        description: 'Snapshot version target'
        required: false
        default: 1.0.0-SNAPSHOT

      serverId:
        description: 'Server id to publish to'
        required: false
        default: central

      mvnFlags:
        description: 'Extra maven flags'
        required: false
        default: ''

      libnd4jUrl:
        description: 'Pre-built libnd4j download URL (skips native C++ build)'
        required: false
        default: ''

      runsOn:
        description: 'Runner to use'
        required: false
        default: ubuntu-22.04

      debug_enabled:
        description: 'Enable tmate debugging'
        required: false
        default: false

      swapSize:
        description: 'Swap file size in GB'
        required: false
        default: 12

jobs:
  linux-x86_64-hexagon:
    runs-on: ${{ github.event.inputs.runsOn }}
    timeout-minutes: 180
    name: linux-x86_64-hexagon (hexagon-mlir native)

    steps:
      - uses: AutoModality/action-clean@v1

      - uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Configure swap space
        shell: bash
        run: |
          if swapon --show | grep -q "/"; then
            echo "Swap already configured."
            swapon --show
          else
            SWAP_SIZE="${{ github.event.inputs.swapSize }}G"
            echo "Creating ${SWAP_SIZE} swap file..."
            sudo fallocate -l ${SWAP_SIZE} /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1G count=${{ github.event.inputs.swapSize }} status=progress
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          sudo sysctl vm.swappiness=80
          free -h

      - uses: ./.github/actions/set-linux-distro-version

      - name: Set mvn build command
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.libnd4jUrl }}" ]; then
            modules=':nd4j-hexagon,:nd4j-hexagon-preset'
          else
            modules=':nd4j-hexagon,:nd4j-hexagon-preset,:libnd4j'
          fi
          # -Phexagon adds nd4j-hexagon/-preset to the reactor (nd4j-backend-impls 'hexagon'
          # profile is -P activated, NOT property activated) — without it `-pl :nd4j-hexagon`
          # cannot resolve. -Dlibnd4j.hexagon separately activates the libnd4j chip=hexagon profile.
          command=$(DL4J_FAMILY=hexagon DL4J_BUILD_THREADS='${{ github.event.inputs.buildThreads }}' DL4J_MVN_FLAGS='${{ github.event.inputs.mvnFlags }}' DL4J_LIBND4J_URL='${{ github.event.inputs.libnd4jUrl }}' bash build-scripts/release/native-platform.sh --print)
          echo "COMMAND=${command}" >> $GITHUB_ENV
          echo "Build command: ${command}"

      - uses: ./.github/actions/update-deps-linux

      - name: Install DWARF headers
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdw-dev libelf-dev libdwarf-dev

      - name: Setup sccache
        id: setup-sccache
        uses: ./.github/actions/setup-sccache-linux
        with:
          cache-suffix: linux-x86_64-hexagon

      - uses: ./.github/actions/install-protobuf-linux

      - uses: ./.github/actions/install-cmake-linux

      - name: Set up Java 11 for publishing
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          server-id: ${{ github.event.inputs.serverId }}
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.SONATYPE_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Setup libnd4j home if download URL specified
        if: ${{ github.event.inputs.libnd4jUrl != '' }}
        shell: bash
        run: |
          mkdir "${GITHUB_WORKSPACE}/openblas_home"
          cd "${GITHUB_WORKSPACE}/openblas_home"
          wget https://repo1.maven.org/maven2/org/bytedeco/openblas/0.3.28-1.5.11/openblas-0.3.28-1.5.11-linux-x86_64.jar
          unzip openblas-0.3.28-1.5.11-linux-x86_64.jar
          cd ..
          echo "OPENBLAS_PATH=${GITHUB_WORKSPACE}/openblas_home/org/bytedeco/openblas/linux-x86_64" >> "$GITHUB_ENV"

      - name: Build Hexagon backend (linux-x86_64)
        shell: bash
        env:
          MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_KEY }}
          DEBIAN_FRONTEND: noninteractive
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TO: central
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASS }}
          PERFORM_RELEASE: ${{ github.event.inputs.deployToReleaseStaging }}
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
          SNAPSHOT_VERSION: ${{ github.event.inputs.snapshotVersion }}
          MAVEN_OPTS: -Xmx2g
          LIBND4J_FILE_NAME: ${{ github.event.inputs.libnd4jUrl }}
        run: |
          export PATH=/opt/protobuf/bin:/opt/cmake/bin:$PATH
          mvn --version
          cmake --version
          protoc --version

          if [ "$PERFORM_RELEASE" == 1 ]; then
            bash ${GITHUB_WORKSPACE}/release-specified-component.sh \
              "${RELEASE_VERSION}" "${SNAPSHOT_VERSION}" "central" "${COMMAND}"
          else
            echo "Deploying Hexagon backend to snapshots"
            BACKOFF=(0 60 180 300 420)
            for attempt in 1 2 3 4 5; do
              eval "${COMMAND}" && break
              DELAY=${BACKOFF[$attempt]:-420}
              echo "::warning::Deploy attempt $attempt failed. Retrying in ${DELAY}s..."
              sleep $DELAY
            done
          fi

      - name: Verify libnd4jhexagon.so produced
        if: ${{ github.event.inputs.libnd4jUrl == '' }}
        shell: bash
        run: |
          SO=$(find libnd4j/blasbuild/hexagon -name 'libnd4jhexagon.so' | head -1)
          if [ -z "$SO" ]; then
            echo "::error::libnd4jhexagon.so was not produced by the native build"
            exit 1
          fi
          ls -la "$SO"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Upload Hexagon build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hexagon-build-logs-linux-x86_64
          path: |
            libnd4j/blasbuild/hexagon/libnd4j-build.log
            libnd4j/blasbuild/hexagon/*.log
          retention-days: 7

      - name: Cleanup swap
        if: always()
        shell: bash
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
