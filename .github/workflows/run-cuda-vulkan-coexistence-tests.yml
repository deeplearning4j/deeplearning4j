name: CUDA and Vulkan Same-JVM Coexistence Tests

on:
  workflow_dispatch:

env:
  MAVEN_OPTS: -Xmx4g
  CUDA_VERSION: '12.9'

jobs:
  cuda-vulkan-hardware-coexistence:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    name: cuda-vulkan-hardware-coexistence

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Report hardware backends
        shell: bash
        run: |
          nvidia-smi
          vulkaninfo --summary

      - name: Build CUDA with the Triton DSP/compiler stack
        shell: bash
        run: |
          set -o pipefail
          mvn -Pcuda \
            -Dcuda.version=${CUDA_VERSION} \
            -Dlibnd4j.triton=ON \
            -Dlibnd4j.chip=cuda \
            -Dlibnd4j.buildthreads=12 \
            -Dlibnd4j.log=libnd4j-cuda-coexistence-build.log \
            -pl libnd4j,:nd4j-presets-common,:nd4j-cuda-${CUDA_VERSION}-preset,:nd4j-cuda-${CUDA_VERSION} \
            clean install -DskipTests \
            --no-transfer-progress --batch-mode \
            2>&1 | tee cuda-coexistence-build.log

      - name: Build Vulkan with Triton DSP and shared MLIR
        shell: bash
        run: |
          set -o pipefail
          mvn -Pvulkan \
            -Dlibnd4j.vulkan \
            -Dcuda.version=${CUDA_VERSION} \
            -Dlibnd4j.triton=ON \
            -Dlibnd4j.mlir=ON \
            -Dlibnd4j.buildthreads=12 \
            -Dlibnd4j.log=libnd4j-vulkan-coexistence-build.log \
            -pl libnd4j,:nd4j-presets-common,:nd4j-vulkan-preset,:nd4j-vulkan \
            clean install -DskipTests \
            --no-transfer-progress --batch-mode \
            2>&1 | tee vulkan-coexistence-build.log

      - name: Run CUDA-first coexistence
        working-directory: platform-tests
        shell: bash
        run: |
          set -o pipefail
          mvn test \
            -Ptest-cuda-vulkan-coexistence \
            -Dcuda.version=${CUDA_VERSION} \
            -Dplatform.classifier=linux-x86_64 \
            -Dtest=CudaVulkanCoexistenceTest \
            -Dnd4j.coexistence.loadOrder=cuda-first \
            -Dnd4j.coexistence.requireTriton=true \
            -Dnd4j.coexistence.requireMultiGpu=true \
            -Dnd4j.coexistence.requireHardwareVulkan=true \
            -Dtest.heap.size=4g \
            -Dtest.offheap.size=8g \
            -DskipTestResourceEnforcement=true \
            --no-transfer-progress --batch-mode \
            2>&1 | tee cuda-first-coexistence.log

      - name: Run Vulkan-first coexistence
        working-directory: platform-tests
        shell: bash
        run: |
          set -o pipefail
          mvn test \
            -Ptest-cuda-vulkan-coexistence \
            -Dcuda.version=${CUDA_VERSION} \
            -Dplatform.classifier=linux-x86_64 \
            -Dtest=CudaVulkanCoexistenceTest \
            -Dnd4j.coexistence.loadOrder=vulkan-first \
            -Dnd4j.coexistence.requireTriton=true \
            -Dnd4j.coexistence.requireMultiGpu=true \
            -Dnd4j.coexistence.requireHardwareVulkan=true \
            -Dtest.heap.size=4g \
            -Dtest.offheap.size=8g \
            -DskipTestResourceEnforcement=true \
            --no-transfer-progress --batch-mode \
            2>&1 | tee vulkan-first-coexistence.log

      - name: Upload coexistence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-vulkan-coexistence
          path: |
            cuda-coexistence-build.log
            vulkan-coexistence-build.log
            platform-tests/cuda-first-coexistence.log
            platform-tests/vulkan-first-coexistence.log
          retention-days: 14
