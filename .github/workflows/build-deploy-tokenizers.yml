name: Build & Deploy Tokenizers (Native per-platform)

on:
  workflow_dispatch:
    inputs:
      deployToReleaseStaging:
        description: 'Whether to deploy to release staging or not.'
        required: false
        default: 0

      releaseVersion:
        description: 'Release version target'
        required: false
        default: 1.0.0-M3

      snapshotVersion:
        description: 'Snapshot version target'
        required: false
        default: 1.0.0-SNAPSHOT

      releaseRepoId:
        description: 'Release repository id'
        required: false
        default: ''

      serverId:
        description: 'Server id to publish to'
        required: false
        default: central

      debug_enabled:
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false

jobs:
  build-tokenizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: linux
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu

          - platform: linux-arm64
            os: linux
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu

          - platform: macosx-arm64
            os: macos
            runner: macos-14
            rust_target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    name: tokenizers-${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Linux)
        if: matrix.os == 'linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          brew install cmake pkg-config

      - name: Set up Java for publishing
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          server-id: ${{ github.event.inputs.serverId }}
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.SONATYPE_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: 'maven'

      - name: Build and deploy tokenizers
        shell: bash
        env:
          MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TO: central
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASS }}
          PERFORM_RELEASE: ${{ github.event.inputs.deployToReleaseStaging }}
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
          SNAPSHOT_VERSION: ${{ github.event.inputs.snapshotVersion }}
          RELEASE_REPO_ID: ${{ github.event.inputs.releaseRepoId }}
          MAVEN_OPTS: -Xmx2g
        run: |
          echo "Building tokenizers for platform: ${{ matrix.platform }}"
          rustc --version
          cargo --version
          cmake --version

          # Build the full tokenizers chain: libtokenizers -> preset -> tokenizers-native
          # This builds Rust FFI, then JavaCPP presets/bindings
          command="mvn -pl :libtokenizers,:tokenizers-native-preset,:tokenizers-native \
            --also-make \
            -Djavacpp.platform=${{ matrix.platform }} \
            -DskipTestResourceEnforcement=true \
            -Dmaven.javadoc.failOnError=false \
            --no-transfer-progress --batch-mode \
            deploy -DskipTests"

          if [ "$PERFORM_RELEASE" == 1 ]; then
            echo "Performing release"
            bash ${GITHUB_WORKSPACE}/release-specified-component.sh \
              "${RELEASE_VERSION}" "${SNAPSHOT_VERSION}" "${RELEASE_REPO_ID}" "${command}"
          else
            echo "Running build and deploying to snapshots"
            eval "$command"
          fi

      - name: Upload native artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokenizers-${{ matrix.platform }}
          path: |
            nd4j/nd4j-tokenizers/libtokenizers/target/native/
            nd4j/nd4j-tokenizers/tokenizers-native/target/*.jar
          retention-days: 14
