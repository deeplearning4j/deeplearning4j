name: Release cache contracts

on:
  workflow_dispatch:
  push:
    branches: [ag_new_release_updates_2]
    paths:
      - 'release/**'
      - 'nd4j/nd4j-tokenizers/libtokenizers/pom.xml'
      - '.github/actions/run-release-worker/**'
      - '.github/actions/setup-sccache-*/**'
      - '.github/workflows/_release-worker.yml'
      - '.github/workflows/release-cache-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install archive transport SDK
        run: python -m pip install boto3==1.40.76
      - name: Validate R2 cache contracts without native builds
        shell: bash
        working-directory: platform-tests
        env:
          PYTHONPATH: ..
        run: |
          set -Eeuo pipefail
          python -m unittest release.github.test_r2_cache \
            2>&1 | tee "${RUNNER_TEMP}/r2-contracts.log"
      - name: Validate complete release contracts
        if: runner.os == 'Linux'
        shell: bash
        working-directory: platform-tests
        env:
          PYTHONPATH: ..
        run: |
          set -Eeuo pipefail
          python -m unittest \
            test_full_release_repository test_release_publication_safety \
            release.github.test_metadata_recovery \
            release.github.test_worker release.central.test_repository \
            release.aws.test_release release.azure.test_release \
            release.azure.test_dependency_cache release.gcp.test_release \
            2>&1 | tee "${RUNNER_TEMP}/release-contracts.log"
      - uses: actions/setup-java@v5
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify native tokenizer release metadata without compilation
        if: runner.os == 'Linux'
        shell: bash
        working-directory: platform-tests
        run: |
          set -Eeuo pipefail
          # Direct metadata goals do not enter generate-sources, invoke Rust/C++, or
          # regenerate Java bindings. Exercise the real release POM, not a fixture.
          mvn --batch-mode --no-transfer-progress \
            -f ../nd4j/nd4j-tokenizers/libtokenizers/pom.xml -Pcentral-release \
            jar:jar@central-native-sources jar:jar@central-native-javadoc \
            2>&1 | tee "${RUNNER_TEMP}/tokenizer-metadata-contract.log"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          source = Path('../nd4j/nd4j-tokenizers/libtokenizers')
          required = {
              'include/tokenizers_c.h', 'include/tokenizers_ffi.h',
              'include/tokenizer_wrapper.h', 'include/model_manager.h',
              'src/tokenizers_c.cpp', 'src/tokenizer_wrapper.cpp', 'src/model_manager.cpp',
              'tokenizers-ffi/src/lib.rs', 'tokenizers-ffi/Cargo.toml',
              'tokenizers-ffi/Cargo.lock', 'tokenizers-ffi/cbindgen.toml',
              'CMakeLists.txt', 'tokenizers.pc.in', 'buildnativetokenizers.sh',
              'build-mobile-tokenizers.sh', 'pom.xml',
          }
          for classifier in ('sources', 'javadoc'):
              archives = list((source / 'target').glob(f'libtokenizers-*-{classifier}.jar'))
              assert len(archives) == 1, archives
              with ZipFile(archives[0]) as archive:
                  entries = {name for name in archive.namelist() if not name.endswith('/')}
                  expected = required if classifier == 'sources' else {
                      name for name in required if name.startswith('include/')}
                  assert expected <= entries, expected - entries
                  for name in entries:
                      if name.startswith('META-INF/'):
                          continue
                      assert not any(part in ('target', 'build') for part in Path(name).parts), name
                      assert not name.endswith(('.so', '.dll', '.dylib', '.class')), name
                      content = archive.read(name)
                      assert content and content == (source / name).read_bytes(), name
                  if classifier == 'javadoc':
                      assert b'@param' in archive.read('include/tokenizers_c.h')
                      assert b'must be freed' in archive.read('include/tokenizers_c.h')
              print(f'Verified real native {classifier}: {archives[0]}')
          PY
      - name: Verify private R2 migrated objects and archive transport
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        working-directory: platform-tests
        env:
          PYTHONPATH: ..
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DL4J_R2_LIVE_VALIDATION: '1'
        run: |
          set -Eeuo pipefail
          python -m unittest release.github.test_r2_cache.R2LiveCacheTests \
            2>&1 | tee "${RUNNER_TEMP}/r2-live-contracts.log"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-cache-contracts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/r2-contracts.log
            ${{ runner.temp }}/release-contracts.log
            ${{ runner.temp }}/tokenizer-metadata-contract.log
            ${{ runner.temp }}/r2-live-contracts.log
          if-no-files-found: warn
