name: Vulkan Lavapipe Fixture Tests

# Software-only fixture; this is not a hardware CUDA+Vulkan coexistence lane.
# Runs the Vulkan compute backend wiring smoke tier on an ordinary hosted
# x86_64 runner with NO GPU hardware: mesa-vulkan-drivers provides lavapipe,
# a CPU-side Vulkan 1.3 ICD, so the loader initializes and a Vulkan device
# can be created without a GPU.
#
#   - classpath + SPI registration of nd4j-vulkan
#   - VulkanBackend.canRun() gating contract (false until bindings + wiring land)
#   - in-process dlopen of the system Vulkan loader (libvulkan.so.1)
#   - nd4j-vulkan.properties contract (device.type token, canRun() gate keys)
#
# See ADR 0110 (Vulkan Backend) and ADR 0102 (Accelerator CI Test Tiers).

on:
  workflow_dispatch:
    inputs:
      testFilter:
        description: 'Surefire -Dtest filter. Empty = VulkanBackendSmokeTest only.'
        required: false
        default: ''

env:
  MAVEN_OPTS: -Xmx2g

jobs:
  vulkan-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: vulkan-smoke (hosted, lavapipe software ICD)

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Vulkan loader and software ICD (lavapipe)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary

      - name: Configure Maven snapshot repository
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS'
          <settings>
            <profiles>
              <profile>
                <id>sonatype-snapshots</id>
                <repositories>
                  <repository>
                    <id>central-portal-snapshots</id>
                    <name>Central Portal Snapshots</name>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled><updatePolicy>always</updatePolicy></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>sonatype-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          SETTINGS

      # -Pvulkan puts nd4j-vulkan/-preset in the reactor; -Ptest-vulkan makes
      # platform-tests depend on nd4j-vulkan so --also-make builds it from source.
      # javacpp parse/compile are skipped: the smoke tier locks the Java wiring
      # contracts and does not need a libnd4jvulkan chip build.
      - name: Build Vulkan Java modules (nd4j-vulkan + preset)
        shell: bash
        run: |
          mvn install -DskipTests -DskipTestResourceEnforcement=true \
            -Pvulkan,test-vulkan \
            -Djavacpp.parser.skip=true \
            -Djavacpp.compiler.skip=true \
            -Djavacpp.platform=linux-x86_64 \
            -Djavacpp.platform.extension= \
            -Dplatform.classifier=linux-x86_64 \
            -Dmaven.javadoc.skip=true \
            -pl :platform-tests --also-make \
            -pl !:libnd4j \
            --no-transfer-progress --batch-mode 2>&1 | tee vulkan-build.log

      - name: Run Vulkan wiring smoke tests
        shell: bash
        run: |
          TEST_FILTER="${{ inputs.testFilter }}"
          if [ -n "$TEST_FILTER" ]; then TEST_FLAGS="-Dtest=${TEST_FILTER}"; else TEST_FLAGS="-Dtest=VulkanBackendSmokeTest"; fi
          cd platform-tests
          mvn test \
            -Ptest-vulkan \
            -Djavacpp.platform=linux-x86_64 \
            -Djavacpp.platform.extension= \
            -Dplatform.classifier=linux-x86_64 \
            -Dtest.heap.size=4g -Dtest.offheap.size=6g \
            -Domp.num.threads=2 \
            -DskipTestResourceEnforcement=true \
            ${TEST_FLAGS} \
            --no-transfer-progress --batch-mode 2>&1 | tee vulkan-smoke-tests.log

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulkan-lavapipe-fixture
          path: |
            platform-tests/target/surefire-reports/
            platform-tests/vulkan-smoke-tests.log
            vulkan-build.log
          retention-days: 14
