name: CPU Sanity Tests

on:
  workflow_dispatch:
    inputs:
      testFilter:
        description: 'Surefire -Dtest filter (e.g. SameDiffTests#testLinearModule). Empty = default sanity set.'
        required: false
        default: ''

      testTier:
        description: 'Tag tier: classes (default -Dtest list), smoke (-Psmoke, ~30s), full-ci (-Pfull-ci, ~5min). Ignored when testFilter is set.'
        required: false
        default: 'classes'
        type: choice
        options:
          - classes
          - smoke
          - full-ci

      runsOn:
        description: 'Override runner for all jobs'
        required: false
        default: ''

jobs:
  sanity-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 variants ──
          - platform: linux-x86_64
            classifier: linux-x86_64
            javacpp_platform: linux-x86_64
            javacpp_extension: ''
            runner: ubuntu-22.04
            os: linux

          - platform: linux-x86_64-onednn
            classifier: linux-x86_64-onednn
            javacpp_platform: linux-x86_64
            javacpp_extension: '-onednn'
            runner: ubuntu-22.04
            os: linux

          - platform: linux-x86_64-avx2
            classifier: linux-x86_64-avx2
            javacpp_platform: linux-x86_64
            javacpp_extension: '-avx2'
            runner: ubuntu-22.04
            os: linux

          - platform: linux-x86_64-onednn-avx2
            classifier: linux-x86_64-onednn-avx2
            javacpp_platform: linux-x86_64
            javacpp_extension: '-onednn-avx2'
            runner: ubuntu-22.04
            os: linux

          - platform: linux-x86_64-compile
            classifier: linux-x86_64-compile
            javacpp_platform: linux-x86_64
            javacpp_extension: '-compile'
            runner: ubuntu-22.04
            os: linux

          # ── Linux ARM64 variants ──
          - platform: linux-arm64
            classifier: linux-arm64
            javacpp_platform: linux-arm64
            javacpp_extension: ''
            runner: ubuntu-22.04-arm
            os: linux

          - platform: linux-arm64-armcompute
            classifier: linux-arm64-armcompute
            javacpp_platform: linux-arm64
            javacpp_extension: '-armcompute'
            runner: ubuntu-22.04-arm
            os: linux

          - platform: linux-arm64-compile
            classifier: linux-arm64-compile
            javacpp_platform: linux-arm64
            javacpp_extension: '-compile'
            runner: ubuntu-22.04-arm
            os: linux

          # ── macOS ARM64 variants ──
          - platform: macosx-arm64
            classifier: macosx-arm64
            javacpp_platform: macosx-arm64
            javacpp_extension: ''
            runner: macos-14
            os: macos

          - platform: macosx-arm64-compile
            classifier: macosx-arm64-compile
            javacpp_platform: macosx-arm64
            javacpp_extension: '-compile'
            runner: macos-14
            os: macos

          - platform: macosx-arm64-mps
            classifier: macosx-arm64-mps
            javacpp_platform: macosx-arm64
            javacpp_extension: '-mps'
            runner: macos-14
            os: macos

          - platform: macosx-arm64-mps-compile
            classifier: macosx-arm64-mps-compile
            javacpp_platform: macosx-arm64
            javacpp_extension: '-mps-compile'
            runner: macos-14
            os: macos

    runs-on: ${{ github.event.inputs.runsOn || matrix.runner }}
    timeout-minutes: 90
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Free Disk Space (Linux)
        if: matrix.os == 'linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven snapshot repository
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS'
          <settings>
            <profiles>
              <profile>
                <id>sonatype-snapshots</id>
                <repositories>
                  <repository>
                    <id>central-portal-snapshots</id>
                    <name>Central Portal Snapshots</name>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled><updatePolicy>always</updatePolicy></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>sonatype-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          SETTINGS

      - name: Build Java modules from source (native jars from snapshots)
        shell: bash
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          mvn install -DskipTests -DskipTestResourceEnforcement=true \
              -Dbackend.artifactId=nd4j-native \
              -Djavacpp.platform=${{ matrix.javacpp_platform }} \
              -Djavacpp.platform.extension=${{ matrix.javacpp_extension }} \
              -Dplatform.classifier=${{ matrix.classifier }} \
              -Dmaven.javadoc.skip=true \
              -pl :platform-tests --also-make \
              -pl !:libnd4j \
              --no-transfer-progress --batch-mode

      - name: Download test resources
        shell: bash
        run: |
          wget -q https://github.com/KonduitAI/dl4j-test-resources/archive/master.zip && unzip -q master.zip
          cd dl4j-test-resources-master
          mvn clean install -DskipTests --no-transfer-progress --batch-mode

      - name: Run sanity tests
        shell: bash
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          TIER="${{ github.event.inputs.testTier }}"
          TEST_FILTER="${{ github.event.inputs.testFilter }}"
          TIER_FLAGS=""
          if [ -n "$TEST_FILTER" ]; then
            TEST_FLAGS="-Dtest=${TEST_FILTER}"
          elif [ "$TIER" = "smoke" ]; then
            TIER_FLAGS="-Psmoke"; TEST_FLAGS=""
          elif [ "$TIER" = "full-ci" ]; then
            TIER_FLAGS="-Pfull-ci"; TEST_FLAGS=""
          else
            TEST_FLAGS="-Dtest=SameDiffTests,SameDiffTrainingTest,BasicOpValidationTests,CustomOpsTests"
          fi
          cd platform-tests
          # NOTE: the pom binds surefire excludedGroups to ${excludedTests} and the forked-JVM
          # OMP_NUM_THREADS to ${omp.num.threads} — shell exports / -DexcludedGroups are no-ops here.
          mvn test \
              ${TIER_FLAGS} \
              -Dbackend.artifactId=nd4j-native \
              -Djavacpp.platform=${{ matrix.javacpp_platform }} \
              -Djavacpp.platform.extension=${{ matrix.javacpp_extension }} \
              -Dplatform.classifier=${{ matrix.classifier }} \
              -Dtest.heap.size=4g -Dtest.offheap.size=6g \
              -Domp.num.threads=1 \
              -DskipTestResourceEnforcement=true \
              -DexcludedTests="long-running-test,large-resources,downloads" \
              ${TEST_FLAGS} \
              --no-transfer-progress --batch-mode --fail-at-end

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.platform }}
          path: platform-tests/target/surefire-reports/
          retention-days: 14
