name: Publish prebuilt release or snapshot to Maven Central

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'GitHub Release tag containing the externally built Maven shards'
        required: true
        type: string
      releaseVersion:
        description: 'Exact Maven release or -SNAPSHOT version'
        required: true
        type: string
      expectedCommit:
        description: 'Exact 40-character commit SHA used by every external builder'
        required: true
        type: string

env:
  PYTHONDONTWRITEBYTECODE: '1'

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.releaseVersion }}
  cancel-in-progress: false

jobs:
  publish:
    environment: maven-central
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Validate immutable publication identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expectedCommit }}
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo 'expectedCommit must be a full lowercase commit SHA' >&2; exit 2; }
          [[ "${RELEASE_VERSION}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'releaseVersion must be a valid Maven version' >&2; exit 2; }
          required_secrets=(CENTRAL_SONATYPE_TOKEN_USERNAME CENTRAL_SONATYPE_TOKEN_PASSWORD)
          if [[ "${RELEASE_VERSION}" != *-SNAPSHOT ]]; then
            required_secrets+=(GPG_PRIVATE_KEY GPG_PASSPHRASE)
          fi
          for secret in "${required_secrets[@]}"; do
            if [[ -z "${!secret}" ]]; then
              printf 'Missing required publication secret: %s\n' "${secret}" >&2
              exit 2
            fi
          done

      - name: Checkout publication tooling from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Configure publication Java and release signing
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          gpg-private-key: ${{ !endsWith(inputs.releaseVersion, '-SNAPSHOT') && secrets.GPG_PRIVATE_KEY || '' }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          server-id: central-portal-snapshots
          server-username: CENTRAL_SONATYPE_TOKEN_USERNAME
          server-password: CENTRAL_SONATYPE_TOKEN_PASSWORD

      - name: Download immutable external release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.releaseTag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-assets

      - name: Verify the downloaded release manifest checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check release-build-manifest.json.sha256
          python3 - <<'PY'
          import json
          manifest = json.load(open('release-build-manifest.json', encoding='utf-8'))
          complete = manifest.get('completeMatrix')
          if complete is None:
              complete = manifest.get('testMavenRepository', {}).get('completeMatrix')
          missing = manifest.get('missingMatrixEntries') or manifest.get('missingWorkflows', [])
          if complete is not True or missing:
              raise SystemExit(f'external release is not a verified complete matrix; missing entries: {missing}')
          PY

      - name: Verify release identity and every downloaded asset
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          EXPECTED_COMMIT: ${{ inputs.expectedCommit }}
        run: |
          set -euo pipefail
          python3 release/central/repository.py verify-release-assets \
            --directory release-assets \
            --manifest release-assets/release-build-manifest.json \
            --release-version "${RELEASE_VERSION}" \
            --commit "${EXPECTED_COMMIT}"

      - name: Merge Maven repository shards
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          EXPECTED_COMMIT: ${{ inputs.expectedCommit }}
        run: |
          set -euo pipefail
          args=()
          for shard in release-assets/maven-repository-*.tar.gz; do
            [ -f "${shard}" ] || { echo 'No Maven repository shards found' >&2; exit 2; }
            args+=(--input "${shard}")
          done
          python3 release/central/repository.py merge "${args[@]}" \
            --output central-repository \
            --manifest merged-release-manifest.json \
            --release-version "${RELEASE_VERSION}" \
            --commit "${EXPECTED_COMMIT}"

      - name: Verify coordinates, version, commit and bytes
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          EXPECTED_COMMIT: ${{ inputs.expectedCommit }}
        run: |
          set -euo pipefail
          metadata_args=()
          if [[ "${RELEASE_VERSION}" != *-SNAPSHOT ]]; then
            metadata_args+=(--release-metadata)
          fi
          python3 release/central/repository.py verify \
            --repository central-repository \
            --manifest merged-release-manifest.json \
            --release-version "${RELEASE_VERSION}" \
            --commit "${EXPECTED_COMMIT}" "${metadata_args[@]}"

      - name: Sign and create the Central Portal bundle
        if: ${{ !endsWith(inputs.releaseVersion, '-SNAPSHOT') }}
        shell: bash
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 release/central/repository.py sign-bundle \
            --repository central-repository \
            --output central-bundle.zip

      - name: Stage in Central Portal and wait for manual review
        if: ${{ !endsWith(inputs.releaseVersion, '-SNAPSHOT') }}
        shell: bash
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 release/central/repository.py upload \
            --bundle central-bundle.zip \
            --wait-seconds 5400 | tee central-deployment.log

      - name: Deploy prebuilt components to Central Portal snapshots
        if: ${{ endsWith(inputs.releaseVersion, '-SNAPSHOT') }}
        shell: bash
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          set -euo pipefail
          python3 release/central/repository.py deploy-snapshot \
            --repository central-repository \
            --release-version "${RELEASE_VERSION}" \
            --repository-id central-portal-snapshots \
            --url https://central.sonatype.com/repository/maven-snapshots/ \
            | tee snapshot-deployment.log

      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: central-deployment-${{ inputs.releaseVersion }}
          path: |
            central-deployment.log
            snapshot-deployment.log
            merged-release-manifest.json
            merged-release-manifest.json.sha256
          if-no-files-found: warn
          retention-days: 90
