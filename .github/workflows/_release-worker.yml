name: Shared DL4J release worker

on:
  workflow_call:
    inputs:
      workflow:
        type: string
        required: true
      sourceRef:
        type: string
        required: false
        default: ""
      runnerOverride:
        type: string
        required: false
        default: ""
      buildThreads:
        type: string
        required: false
        default: ""
      mvnFlags:
        type: string
        required: false
        default: ""
      classifiers:
        type: string
        required: false
        default: ""
      targetedRetry:
        type: string
        required: false
        default: "0"
      libnd4jUrl:
        type: string
        required: false
        default: ""
      buildAot:
        type: string
        required: false
        default: "0"
      aotAllSpins:
        type: string
        required: false
        default: "0"
    secrets:
      AZURE_SCCACHE_CONNECTION_STRING:
        required: false
      CENTRAL_SONATYPE_TOKEN_USERNAME:
        required: true
      CENTRAL_SONATYPE_TOKEN_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      source: ${{ steps.source.outputs.result }}
      linux: ${{ steps.rows.outputs.linux }}
      host: ${{ steps.rows.outputs.host }}
    steps:
      - name: Resolve source ref
        id: source
        uses: actions/github-script@v9
        env:
          SOURCE_REF: ${{ inputs.sourceRef }}
        with:
          result-encoding: string
          script: |
            const ref = process.env.SOURCE_REF || context.sha;
            const { data } = await github.rest.repos.getCommit({
              ...context.repo,
              ref,
            });
            core.info(`Resolved source ref ${ref} to ${data.sha}`);
            return data.sha;
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.result }}
      - name: Resolve canonical worker matrix
        id: rows
        shell: bash
        env:
          WORKFLOW: ${{ inputs.workflow }}
          RUNNER_OVERRIDE: ${{ inputs.runnerOverride }}
          CLASSIFIERS: ${{ inputs.classifiers }}
          TARGETED_RETRY: ${{ inputs.targetedRetry }}
        run: |
          set -Eeuo pipefail
          selection_mode=complete
          if [[ "$TARGETED_RETRY" == "1" ]]; then
            selection_mode=targeted
          fi
          linux=$(python release/github/prepare-worker.py matrix \
            --workflow "$WORKFLOW" --group linux --runner-override "$RUNNER_OVERRIDE" \
            --classifiers "$CLASSIFIERS" --selection-mode "$selection_mode")
          host=$(python release/github/prepare-worker.py matrix \
            --workflow "$WORKFLOW" --group host --runner-override "$RUNNER_OVERRIDE" \
            --classifiers "$CLASSIFIERS" --selection-mode "$selection_mode")
          printf 'linux=%s\n' "$linux" >>"$GITHUB_OUTPUT"
          printf 'host=%s\n' "$host" >>"$GITHUB_OUTPUT"

  linux:
    needs: matrix
    if: needs.matrix.outputs.linux != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.linux) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    container:
      image: ${{ matrix.container }}
      options: --shm-size=4g
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.matrix.outputs.source }}
      - name: Restore managed dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.libnd4j
          key: dl4j-dependency-v4-${{ runner.os }}-${{ matrix.dependencyCacheKey }}-${{ hashFiles('libnd4j/cmake/Dependencies.cmake', 'libnd4j/cmake/ZludaConfiguration.cmake', 'release/aws/build-platform.py', 'release/github/bootstrap-worker.sh', 'release/github/bootstrap-worker.ps1') }}
          restore-keys: |
            dl4j-dependency-v4-${{ runner.os }}-${{ matrix.dependencyCacheKey }}-
      - name: Run worker
        id: worker
        uses: ./.github/actions/run-release-worker
        with:
          shard: ${{ matrix.shard }}
          variant: ${{ matrix.variant }}
          source-commit: ${{ needs.matrix.outputs.source }}
          build-threads: ${{ inputs.buildThreads }}
          maven-flags: ${{ inputs.mvnFlags }}
          libnd4j-url: ${{ inputs.libnd4jUrl }}
          build-aot: ${{ inputs.buildAot }}
          aot-all-spins: ${{ inputs.aotAllSpins }}
          azure-cache-connection-string: ${{ secrets.AZURE_SCCACHE_CONNECTION_STRING }}
      - name: Upload staged worker result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-worker-${{ matrix.artifactId }}
          path: ${{ github.workspace }}/.release-worker/${{ matrix.shard }}/${{ matrix.variant }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  host:
    needs: matrix
    if: needs.matrix.outputs.host != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.host) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.matrix.outputs.source }}
      - name: Restore managed dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.libnd4j
          key: dl4j-dependency-v4-${{ runner.os }}-${{ matrix.dependencyCacheKey }}-${{ hashFiles('libnd4j/cmake/Dependencies.cmake', 'libnd4j/cmake/ZludaConfiguration.cmake', 'release/aws/build-platform.py', 'release/github/bootstrap-worker.sh', 'release/github/bootstrap-worker.ps1') }}
          restore-keys: |
            dl4j-dependency-v4-${{ runner.os }}-${{ matrix.dependencyCacheKey }}-
      - name: Run worker
        id: worker
        uses: ./.github/actions/run-release-worker
        with:
          shard: ${{ matrix.shard }}
          variant: ${{ matrix.variant }}
          source-commit: ${{ needs.matrix.outputs.source }}
          build-threads: ${{ inputs.buildThreads }}
          maven-flags: ${{ inputs.mvnFlags }}
          libnd4j-url: ${{ inputs.libnd4jUrl }}
          build-aot: ${{ inputs.buildAot }}
          aot-all-spins: ${{ inputs.aotAllSpins }}
          azure-cache-connection-string: ${{ secrets.AZURE_SCCACHE_CONNECTION_STRING }}
      - name: Upload staged worker result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-worker-${{ matrix.artifactId }}
          path: ${{ github.workspace }}/.release-worker/${{ matrix.shard }}/${{ matrix.variant }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  publish:
    needs: [matrix, linux, host]
    if: ${{ always() && needs.matrix.result == 'success' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.host.result == 'success' || needs.host.result == 'skipped') &&
      (needs.matrix.outputs.linux != '[]' || needs.matrix.outputs.host != '[]') }}
    name: publish / staged Maven snapshot
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.matrix.outputs.source }}
      - name: Download staged worker results
        uses: actions/download-artifact@v8
        with:
          pattern: release-worker-*
          path: ${{ github.workspace }}/.release-worker-publish
          merge-multiple: false
      - name: Inspect staged worker results
        id: staged
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.matrix.outputs.source }}
        run: |
          set -Eeuo pipefail
          artifact_root="${GITHUB_WORKSPACE}/.release-worker-publish"
          mapfile -t worker_roots < <(
            find "${artifact_root}" -type f -name worker-config.json \
              -printf '%h\n' | sort
          )
          if [ "${#worker_roots[@]}" -eq 0 ]; then
            printf 'No staged worker configurations were downloaded.\n' >&2
            exit 1
          fi
          release_version=""
          for worker_root in "${worker_roots[@]}"; do
            if [ ! -f "${worker_root}/worker-success" ]; then
              printf 'Worker did not complete successfully: %s\n' "${worker_root}" >&2
              exit 1
            fi
            if [ ! -d "${worker_root}/maven-repository" ]; then
              printf 'Worker is missing its Maven repository: %s\n' "${worker_root}" >&2
              exit 1
            fi
            current_version=$(python3 release/github/prepare-worker.py release-version \
              --config "${worker_root}/worker-config.json")
            current_commit=$(python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["commit"])' \
              "${worker_root}/worker-config.json")
            if [ "${current_commit}" != "${EXPECTED_SOURCE_COMMIT}" ]; then
              printf 'Worker source commit mismatch: expected %s, got %s (%s)\n' \
                "${EXPECTED_SOURCE_COMMIT}" "${current_commit}" "${worker_root}" >&2
              exit 1
            fi
            python3 -c \
              'import re,sys; raise SystemExit(0 if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*-SNAPSHOT", sys.argv[1]) else 1)' \
              "${current_version}" || {
                printf 'Invalid Maven snapshot version: %s\n' "${current_version}" >&2
                exit 1
              }
            if [ -z "${release_version}" ]; then
              release_version="${current_version}"
            elif [ "${release_version}" != "${current_version}" ]; then
              printf 'Staged workers disagree on release version: %s vs %s\n' \
                "${release_version}" "${current_version}" >&2
              exit 1
            fi
          done
          printf 'release-version=%s\n' "${release_version}" >>"${GITHUB_OUTPUT}"
          if [[ "${release_version}" == *-SNAPSHOT ]]; then
            printf 'publish=true\n' >>"${GITHUB_OUTPUT}"
          else
            printf 'publish=false\n' >>"${GITHUB_OUTPUT}"
          fi
      - name: Configure Maven Central snapshots
        if: steps.staged.outputs.publish == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          server-id: central-portal-snapshots
          server-username: CENTRAL_SONATYPE_TOKEN_USERNAME
          server-password: CENTRAL_SONATYPE_TOKEN_PASSWORD
      - name: Publish merged staged Maven snapshot
        if: steps.staged.outputs.publish == 'true'
        shell: bash
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          RELEASE_VERSION: ${{ steps.staged.outputs.release-version }}
          SOURCE_COMMIT: ${{ needs.matrix.outputs.source }}
        run: |
          set -Eeuo pipefail
          if ! [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Invalid source commit: %s\n' "${SOURCE_COMMIT}" >&2
            exit 1
          fi
          artifact_root="${GITHUB_WORKSPACE}/.release-worker-publish"
          merged_repository="${GITHUB_WORKSPACE}/.release-worker-merged/maven-repository"
          merged_manifest="${GITHUB_WORKSPACE}/.release-worker-merged/repository-manifest.json"
          rm -rf "${GITHUB_WORKSPACE}/.release-worker-merged"
          mkdir -p "${GITHUB_WORKSPACE}/.release-worker-merged"
          merge_command=(python3 release/central/repository.py merge
            --output "${merged_repository}"
            --manifest "${merged_manifest}"
            --release-version "${RELEASE_VERSION}"
            --commit "${SOURCE_COMMIT}"
            --allow-unclassified-duplicates)
          repository_count=0
          while IFS= read -r repository; do
            merge_command+=(--input "${repository}")
            repository_count=$((repository_count + 1))
          done < <(find "${artifact_root}" -type d -name maven-repository | sort)
          if [ "${repository_count}" -eq 0 ]; then
            printf 'No staged Maven repositories were found.\n' >&2
            exit 1
          fi
          "${merge_command[@]}"
          python3 release/central/repository.py verify \
            --repository "${merged_repository}" \
            --manifest "${merged_manifest}" \
            --release-version "${RELEASE_VERSION}" \
            --commit "${SOURCE_COMMIT}"
          python3 release/central/repository.py deploy-snapshot \
            --repository "${merged_repository}" \
            --release-version "${RELEASE_VERSION}" \
            --repository-id central-portal-snapshots \
            --url https://central.sonatype.com/repository/maven-snapshots/ \
            --maven-executable mvn
