name: Shared DL4J release worker

on:
  workflow_call:
    inputs:
      workflow:
        type: string
        required: true
      sourceRef:
        type: string
        required: false
        default: ""
      releaseVersion:
        type: string
        required: false
        default: 1.0.0-M3
      snapshotVersion:
        type: string
        required: false
        default: 1.0.0-SNAPSHOT
      deployToReleaseStaging:
        type: string
        required: false
        default: "0"
      dryRun:
        type: string
        required: false
        default: "false"
      runnerOverride:
        type: string
        required: false
        default: ""
      buildThreads:
        type: string
        required: false
        default: ""
      mvnFlags:
        type: string
        required: false
        default: ""
      classifiers:
        type: string
        required: false
        default: ""
      targetedRetry:
        type: string
        required: false
        default: "0"
      libnd4jUrl:
        type: string
        required: false
        default: ""
      buildAot:
        type: string
        required: false
        default: "0"
      aotAllSpins:
        type: string
        required: false
        default: "0"
    secrets:
      AZURE_SCCACHE_CONNECTION_STRING:
        required: false
      CENTRAL_SONATYPE_TOKEN_USERNAME:
        required: true
      CENTRAL_SONATYPE_TOKEN_PASSWORD:
        required: true
      SONATYPE_GPG_KEY:
        required: false
      PACKAGES_GPG_PASS:
        required: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      source: ${{ steps.source.outputs.result }}
      linux: ${{ steps.rows.outputs.linux }}
      host: ${{ steps.rows.outputs.host }}
      release-version: ${{ steps.publication.outputs.release-version }}
      snapshot-version: ${{ steps.publication.outputs.snapshot-version }}
      publication-mode: ${{ steps.publication.outputs.publication-mode }}
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - name: Resolve source ref
        id: source
        uses: actions/github-script@v9
        env:
          SOURCE_REF: ${{ inputs.sourceRef }}
        with:
          result-encoding: string
          script: |
            const ref = process.env.SOURCE_REF || context.sha;
            const { data } = await github.rest.repos.getCommit({
              ...context.repo,
              ref,
            });
            core.info(`Resolved source ref ${ref} to ${data.sha}`);
            return data.sha;
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.result }}
      - name: Validate publication configuration
        id: publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          SNAPSHOT_VERSION: ${{ inputs.snapshotVersion }}
          DEPLOY_TO_RELEASE_STAGING: ${{ inputs.deployToReleaseStaging }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${SNAPSHOT_VERSION}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*-SNAPSHOT$ ]]; then
            printf 'snapshotVersion must be a valid version ending in -SNAPSHOT: %s\n' \
              "${SNAPSHOT_VERSION}" >&2
            exit 2
          fi
          case "${DEPLOY_TO_RELEASE_STAGING}" in
            0)
              publication_mode=snapshot
              effective_release_version="${SNAPSHOT_VERSION}"
              ;;
            1)
              publication_mode=release
              effective_release_version="${RELEASE_VERSION}"
              if [[ ! "${effective_release_version}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
                 [[ "${effective_release_version}" == *-SNAPSHOT ]]; then
                printf 'releaseVersion must be a valid non-SNAPSHOT version: %s\n' \
                  "${effective_release_version}" >&2
                exit 2
              fi
              ;;
            *)
              printf 'deployToReleaseStaging must be 0 or 1: %s\n' \
                "${DEPLOY_TO_RELEASE_STAGING}" >&2
              exit 2
              ;;
          esac
          case "${DRY_RUN}" in
            false) publish=true ;;
            true) publish=false ;;
            *)
              printf 'dryRun must be true or false: %s\n' "${DRY_RUN}" >&2
              exit 2
              ;;
          esac
          printf 'release-version=%s\n' "${effective_release_version}" >>"${GITHUB_OUTPUT}"
          printf 'snapshot-version=%s\n' "${SNAPSHOT_VERSION}" >>"${GITHUB_OUTPUT}"
          printf 'publication-mode=%s\n' "${publication_mode}" >>"${GITHUB_OUTPUT}"
          printf 'publish=%s\n' "${publish}" >>"${GITHUB_OUTPUT}"
      - name: Resolve canonical worker matrix
        id: rows
        shell: bash
        env:
          WORKFLOW: ${{ inputs.workflow }}
          RUNNER_OVERRIDE: ${{ inputs.runnerOverride }}
          CLASSIFIERS: ${{ inputs.classifiers }}
          TARGETED_RETRY: ${{ inputs.targetedRetry }}
        run: |
          set -Eeuo pipefail
          selection_mode=complete
          if [[ "$TARGETED_RETRY" == "1" ]]; then
            selection_mode=targeted
          fi
          linux=$(python release/github/prepare-worker.py matrix \
            --workflow "$WORKFLOW" --group linux --runner-override "$RUNNER_OVERRIDE" \
            --classifiers "$CLASSIFIERS" --selection-mode "$selection_mode")
          host=$(python release/github/prepare-worker.py matrix \
            --workflow "$WORKFLOW" --group host --runner-override "$RUNNER_OVERRIDE" \
            --classifiers "$CLASSIFIERS" --selection-mode "$selection_mode")
          printf 'linux=%s\n' "$linux" >>"$GITHUB_OUTPUT"
          printf 'host=%s\n' "$host" >>"$GITHUB_OUTPUT"

  linux:
    needs: matrix
    if: needs.matrix.outputs.linux != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.linux) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    container:
      image: ${{ matrix.container }}
      options: --shm-size=4g
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.matrix.outputs.source }}
      - name: Restore managed dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.libnd4j
          key: dl4j-dependency-v4-${{ runner.os }}-${{ matrix.dependencyCacheKey }}-${{ hashFiles('libnd4j/cmake/Dependencies.cmake', 'libnd4j/cmake/ZludaConfiguration.cmake', 'release/aws/build-platform.py', 'release/github/bootstrap-worker.sh', 'release/github/bootstrap-worker.ps1') }}
          restore-keys: |
            dl4j-dependency-v4-${{ runner.os }}-${{ matrix.dependencyCacheKey }}-
      - name: Run worker
        id: worker
        uses: ./.github/actions/run-release-worker
        with:
          shard: ${{ matrix.shard }}
          variant: ${{ matrix.variant }}
          source-commit: ${{ needs.matrix.outputs.source }}
          release-version: ${{ needs.matrix.outputs['release-version'] }}
          snapshot-version: ${{ needs.matrix.outputs['snapshot-version'] }}
          build-threads: ${{ inputs.buildThreads }}
          maven-flags: ${{ inputs.mvnFlags }}
          libnd4j-url: ${{ inputs.libnd4jUrl }}
          build-aot: ${{ inputs.buildAot }}
          aot-all-spins: ${{ inputs.aotAllSpins }}
          azure-cache-connection-string: ${{ secrets.AZURE_SCCACHE_CONNECTION_STRING }}
      - name: Upload staged worker result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-worker-${{ matrix.artifactId }}
          path: ${{ github.workspace }}/.release-worker/${{ matrix.shard }}/${{ matrix.variant }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  host:
    needs: matrix
    if: needs.matrix.outputs.host != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.host) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.matrix.outputs.source }}
      - name: Restore managed dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.libnd4j
          key: dl4j-dependency-v4-${{ runner.os }}-${{ matrix.dependencyCacheKey }}-${{ hashFiles('libnd4j/cmake/Dependencies.cmake', 'libnd4j/cmake/ZludaConfiguration.cmake', 'release/aws/build-platform.py', 'release/github/bootstrap-worker.sh', 'release/github/bootstrap-worker.ps1') }}
          restore-keys: |
            dl4j-dependency-v4-${{ runner.os }}-${{ matrix.dependencyCacheKey }}-
      - name: Run worker
        id: worker
        uses: ./.github/actions/run-release-worker
        with:
          shard: ${{ matrix.shard }}
          variant: ${{ matrix.variant }}
          source-commit: ${{ needs.matrix.outputs.source }}
          release-version: ${{ needs.matrix.outputs['release-version'] }}
          snapshot-version: ${{ needs.matrix.outputs['snapshot-version'] }}
          build-threads: ${{ inputs.buildThreads }}
          maven-flags: ${{ inputs.mvnFlags }}
          libnd4j-url: ${{ inputs.libnd4jUrl }}
          build-aot: ${{ inputs.buildAot }}
          aot-all-spins: ${{ inputs.aotAllSpins }}
          azure-cache-connection-string: ${{ secrets.AZURE_SCCACHE_CONNECTION_STRING }}
      - name: Upload staged worker result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-worker-${{ matrix.artifactId }}
          path: ${{ github.workspace }}/.release-worker/${{ matrix.shard }}/${{ matrix.variant }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  publish:
    needs: [matrix, linux, host]
    if: ${{ always() && needs.matrix.result == 'success' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.host.result == 'success' || needs.host.result == 'skipped') &&
      (needs.matrix.outputs.linux != '[]' || needs.matrix.outputs.host != '[]') }}
    name: publish / staged Maven repository
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.matrix.outputs.source }}
      - name: Download staged worker results
        uses: actions/download-artifact@v8
        with:
          pattern: release-worker-*
          path: ${{ github.workspace }}/.release-worker-publish
          merge-multiple: false
      - name: Inspect staged worker results
        id: staged
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.matrix.outputs.source }}
          EXPECTED_RELEASE_VERSION: ${{ needs.matrix.outputs['release-version'] }}
          PUBLICATION_MODE: ${{ needs.matrix.outputs['publication-mode'] }}
          PUBLISH: ${{ needs.matrix.outputs.publish }}
        run: |
          set -Eeuo pipefail
          artifact_root="${GITHUB_WORKSPACE}/.release-worker-publish"
          mapfile -t worker_roots < <(
            find "${artifact_root}" -type f -name worker-config.json \
              -printf '%h\n' | sort
          )
          if [ "${#worker_roots[@]}" -eq 0 ]; then
            printf 'No staged worker configurations were downloaded.\n' >&2
            exit 1
          fi
          for worker_root in "${worker_roots[@]}"; do
            if [ ! -f "${worker_root}/worker-success" ]; then
              printf 'Worker did not complete successfully: %s\n' "${worker_root}" >&2
              exit 1
            fi
            if [ ! -d "${worker_root}/maven-repository" ]; then
              printf 'Worker is missing its Maven repository: %s\n' "${worker_root}" >&2
              exit 1
            fi
            current_version=$(python3 release/github/prepare-worker.py release-version \
              --config "${worker_root}/worker-config.json")
            current_commit=$(python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["commit"])' \
              "${worker_root}/worker-config.json")
            if [ "${current_commit}" != "${EXPECTED_SOURCE_COMMIT}" ]; then
              printf 'Worker source commit mismatch: expected %s, got %s (%s)\n' \
                "${EXPECTED_SOURCE_COMMIT}" "${current_commit}" "${worker_root}" >&2
              exit 1
            fi
            if [ "${current_version}" != "${EXPECTED_RELEASE_VERSION}" ]; then
              printf 'Worker release version mismatch: expected %s, got %s (%s)\n' \
                "${EXPECTED_RELEASE_VERSION}" "${current_version}" "${worker_root}" >&2
              exit 1
            fi
          done
          printf 'release-version=%s\n' "${EXPECTED_RELEASE_VERSION}" >>"${GITHUB_OUTPUT}"
          printf 'publication-mode=%s\n' "${PUBLICATION_MODE}" >>"${GITHUB_OUTPUT}"
          printf 'publish=%s\n' "${PUBLISH}" >>"${GITHUB_OUTPUT}"
      - name: Merge and verify staged Maven repository
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.staged.outputs['release-version'] }}
          SOURCE_COMMIT: ${{ needs.matrix.outputs.source }}
        run: |
          set -Eeuo pipefail
          if ! [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Invalid source commit: %s\n' "${SOURCE_COMMIT}" >&2
            exit 1
          fi
          artifact_root="${GITHUB_WORKSPACE}/.release-worker-publish"
          merged_root="${GITHUB_WORKSPACE}/.release-worker-merged"
          merged_repository="${merged_root}/maven-repository"
          merged_manifest="${merged_root}/repository-manifest.json"
          rm -rf "${merged_root}"
          mkdir -p "${merged_root}"
          merge_command=(python3 release/central/repository.py merge
            --output "${merged_repository}"
            --manifest "${merged_manifest}"
            --release-version "${RELEASE_VERSION}"
            --commit "${SOURCE_COMMIT}"
            --allow-unclassified-duplicates)
          repository_count=0
          while IFS= read -r repository; do
            merge_command+=(--input "${repository}")
            repository_count=$((repository_count + 1))
          done < <(find "${artifact_root}" -type d -name maven-repository | sort)
          if [ "${repository_count}" -eq 0 ]; then
            printf 'No staged Maven repositories were found.\n' >&2
            exit 1
          fi
          "${merge_command[@]}"
          python3 release/central/repository.py verify \
            --repository "${merged_repository}" \
            --manifest "${merged_manifest}" \
            --release-version "${RELEASE_VERSION}" \
            --commit "${SOURCE_COMMIT}"
      - name: Configure Maven Central snapshots
        if: ${{ steps.staged.outputs.publish == 'true' && steps.staged.outputs['publication-mode'] == 'snapshot' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          server-id: central-portal-snapshots
          server-username: CENTRAL_SONATYPE_TOKEN_USERNAME
          server-password: CENTRAL_SONATYPE_TOKEN_PASSWORD
      - name: Publish merged staged Maven snapshot
        if: ${{ steps.staged.outputs.publish == 'true' && steps.staged.outputs['publication-mode'] == 'snapshot' }}
        shell: bash
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          RELEASE_VERSION: ${{ steps.staged.outputs['release-version'] }}
        run: |
          set -Eeuo pipefail
          python3 release/central/repository.py deploy-snapshot \
            --repository "${GITHUB_WORKSPACE}/.release-worker-merged/maven-repository" \
            --release-version "${RELEASE_VERSION}" \
            --repository-id central-portal-snapshots \
            --url https://central.sonatype.com/repository/maven-snapshots/ \
            --maven-executable mvn
      - name: Configure Maven Central release signing
        if: ${{ steps.staged.outputs.publish == 'true' && steps.staged.outputs['publication-mode'] == 'release' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          gpg-private-key: ${{ secrets.SONATYPE_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          server-id: central
          server-username: CENTRAL_SONATYPE_TOKEN_USERNAME
          server-password: CENTRAL_SONATYPE_TOKEN_PASSWORD
      - name: Stage merged Maven release in Central Portal
        if: ${{ steps.staged.outputs.publish == 'true' && steps.staged.outputs['publication-mode'] == 'release' }}
        shell: bash
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASS }}
        run: |
          set -Eeuo pipefail
          merged_root="${GITHUB_WORKSPACE}/.release-worker-merged"
          python3 release/central/repository.py sign-bundle \
            --repository "${merged_root}/maven-repository" \
            --output "${merged_root}/central-bundle.zip"
          python3 release/central/repository.py upload \
            --bundle "${merged_root}/central-bundle.zip" \
            --wait-seconds 5400 | tee "${merged_root}/central-deployment.log"
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-publication-${{ needs.matrix.outputs['release-version'] }}
          path: |
            ${{ github.workspace }}/.release-worker-merged/repository-manifest.json
            ${{ github.workspace }}/.release-worker-merged/repository-manifest.json.sha256
            ${{ github.workspace }}/.release-worker-merged/central-deployment.log
          if-no-files-found: warn
          retention-days: 90
