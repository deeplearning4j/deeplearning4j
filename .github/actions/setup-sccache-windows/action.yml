name: Setup sccache for Windows
description: 'Install and configure sccache with GitHub Actions cache backend for distributed per-object caching'

inputs:
  cache-suffix:
    description: 'Suffix for sccache GHA version key (e.g., cuda-12.6). Used to partition cache namespaces.'
    required: false
    default: ''

outputs:
  sccache-available:
    description: 'Whether sccache was successfully set up'
    value: ${{ steps.verify-sccache.outputs.available }}

runs:
  using: composite
  steps:
    # ---------------------------------------------------------------
    # 1. Hash the patch file for cache key.
    # ---------------------------------------------------------------
    - name: Hash sccache patch
      id: patch-hash
      shell: bash
      run: |
        PATCH_FILE="${GITHUB_WORKSPACE}/.github/patches/sccache-retry.patch"
        if [ -f "$PATCH_FILE" ]; then
          HASH=$(sha256sum "$PATCH_FILE" | cut -c1-16)
        else
          HASH="no-patch"
        fi
        echo "hash=$HASH" >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------
    # 2. Check GHA cache for a previously-built patched binary.
    # ---------------------------------------------------------------
    - name: Cache patched sccache binary
      id: cache-sccache
      uses: actions/cache@v4
      with:
        path: C:\sccache-patched-bin
        key: sccache-patched-v0.17.0-windows-${{ runner.arch }}-${{ steps.patch-hash.outputs.hash }}

    # ---------------------------------------------------------------
    # 3. On cache miss: clone, patch, and build from source.
    # ---------------------------------------------------------------
    - name: Build patched sccache from source
      if: steps.cache-sccache.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        SCCACHE_VERSION="v0.17.0"
        PATCH_FILE="${GITHUB_WORKSPACE}/.github/patches/sccache-retry.patch"

        # Ensure Rust is available (pre-installed on GHA Windows runners)
        if ! command -v cargo &>/dev/null; then
          echo "ERROR: Rust/cargo not found on this runner"
          exit 1
        fi

        # Clone sccache source at the target version
        git clone --depth 1 --branch "$SCCACHE_VERSION" \
          https://github.com/mozilla/sccache.git /tmp/sccache-src

        # Apply the RetryLayer patch
        if [ -f "$PATCH_FILE" ]; then
          cd /tmp/sccache-src
          patch -p1 < "$PATCH_FILE"
          echo "Applied RetryLayer patch to gha.rs"
        else
          echo "WARNING: Patch file not found at $PATCH_FILE — building unpatched"
        fi

        # Build with only the GHA cache feature
        cd /tmp/sccache-src
        cargo build --release --features gha --no-default-features

        # Stage the binary for GHA cache storage
        mkdir -p /c/sccache-patched-bin
        cp target/release/sccache.exe /c/sccache-patched-bin/sccache.exe
        echo "Built patched sccache (with RetryLayer):"
        /c/sccache-patched-bin/sccache.exe --version

    # ---------------------------------------------------------------
    # 4. Install the binary — patched if available, upstream fallback.
    # ---------------------------------------------------------------
    - name: Install sccache
      continue-on-error: true
      shell: pwsh
      run: |
        $sccacheVersion = "v0.17.0"
        $versionBare    = $sccacheVersion.TrimStart('v')
        $installDir     = "$env:USERPROFILE\sccache"
        if (-not (Test-Path $installDir)) { New-Item -ItemType Directory -Path $installDir -Force | Out-Null }

        $patchedBin = "C:\sccache-patched-bin\sccache.exe"
        if (Test-Path $patchedBin) {
          Copy-Item $patchedBin "$installDir\sccache.exe" -Force
          Write-Host "Installed patched sccache (with RetryLayer):"
          & "$installDir\sccache.exe" --version
        } else {
          # Fallback to upstream unpatched release
          Write-Host "Patched build not available — falling back to upstream sccache ${sccacheVersion}."
          $upstreamFile = "sccache-${sccacheVersion}-x86_64-pc-windows-msvc"
          $upstreamUrl  = "https://github.com/mozilla/sccache/releases/download/${sccacheVersion}/${upstreamFile}.tar.gz"
          Write-Host "Downloading $upstreamUrl ..."
          $tarball = "$env:TEMP\sccache.tar.gz"
          Invoke-WebRequest -Uri $upstreamUrl -OutFile $tarball -UseBasicParsing
          tar -xzf $tarball -C $env:TEMP
          Copy-Item "$env:TEMP\${upstreamFile}\sccache.exe" "$installDir\sccache.exe" -Force
          if (Test-Path "$installDir\sccache.exe") {
            Write-Host "Installed upstream sccache (unpatched fallback):"
            & "$installDir\sccache.exe" --version
          } else {
            Write-Host "WARNING: sccache installation failed"
          }
        }

        Add-Content -Path $env:GITHUB_PATH -Value $installDir

    # ---------------------------------------------------------------
    # 5. Configure the GHA cache backend (V2 API).
    # ---------------------------------------------------------------
    - name: Configure sccache GHA backend
      uses: actions/github-script@v7
      with:
        script: |
          // Force V2 cache service — required for OpenDAL ghac writes.
          // Without this, OpenDAL falls back to the dead V1 protocol and writes fail
          // with "Cannot write to read-only storage".
          core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    # ---------------------------------------------------------------
    # 6. Start the sccache server with GHA backend enabled.
    # ---------------------------------------------------------------
    - name: Set sccache environment
      continue-on-error: true
      shell: pwsh
      run: |
        # Enable GitHub Actions cache backend.
        # Set in current process AND persist for subsequent steps via GITHUB_ENV.
        # sccache reads these at server-start time — if only in GITHUB_ENV
        # (takes effect next step), the server falls back to local disk.
        $env:SCCACHE_GHA_ENABLED = "true"
        Add-Content -Path $env:GITHUB_ENV -Value "SCCACHE_GHA_ENABLED=true"

        # Never let the server idle-shut-down mid-build (default is 600s).
        # On Windows CUDA the sccache launcher wraps only CXX (.cpp), NOT nvcc
        # (.cu) — the CUDA launcher is deliberately skipped because sccache breaks
        # nvcc's temp-file handling. So the build compiles its .cpp files, then
        # spends 1-2h on uncached .cu compilation during which the sccache server
        # receives ZERO requests, idles past 600s, and terminates. The next .cpp
        # compile (or the end-of-build --show-stats) then hits a dead server and
        # fails with "Timed out waiting for server startup", killing the whole
        # build — the chronic windows-cuda failure. 0 = never idle-shutdown.
        # (Linux CUDA does wrap nvcc, so its server stays busy and never hit this.)
        # Must be set in the current process too: sccache reads it at --start-server.
        $env:SCCACHE_IDLE_TIMEOUT = "0"
        Add-Content -Path $env:GITHUB_ENV -Value "SCCACHE_IDLE_TIMEOUT=0"

        # Partition cache by suffix
        $suffix = "${{ inputs.cache-suffix }}" -replace '-+$', ''
        if ($suffix) {
          $env:SCCACHE_GHA_VERSION = $suffix
          Add-Content -Path $env:GITHUB_ENV -Value "SCCACHE_GHA_VERSION=$suffix"
        }

        # Disable PCH
        Add-Content -Path $env:GITHUB_ENV -Value "SD_DISABLE_PCH=1"

        # Expose GitHub Actions cache API tokens and V2 flag to sccache in current process
        $env:ACTIONS_CACHE_SERVICE_V2 = $env:ACTIONS_CACHE_SERVICE_V2
        $env:ACTIONS_RESULTS_URL = $env:ACTIONS_RESULTS_URL
        $env:ACTIONS_RUNTIME_TOKEN = $env:ACTIONS_RUNTIME_TOKEN

        # Start sccache server — only set compiler launcher if server starts successfully
        $sccacheExe = "$env:USERPROFILE\sccache\sccache.exe"
        if (Test-Path $sccacheExe) {
          $serverResult = & $sccacheExe --start-server 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "sccache server started successfully"
            Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_C_COMPILER_LAUNCHER=sccache"
            Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
            # Do NOT set CMAKE_CUDA_COMPILER_LAUNCHER on Windows — sccache wrapping
            # nvcc breaks nvcc's temp file handling (tmpxft_* stderr redirect fails
            # with "Could not open input file"), causing all .cu compilation to fail.
            Add-Content -Path $env:GITHUB_ENV -Value "SD_USE_SCCACHE=1"
          } else {
            Write-Host "WARNING: sccache server failed to start — building without distributed cache"
            Write-Host $serverResult
          }
          Write-Host "=== sccache configuration ==="
          & $sccacheExe --show-stats 2>$null
        }

    # ---------------------------------------------------------------
    # 7. Final verification.
    # ---------------------------------------------------------------
    - name: Verify sccache
      id: verify-sccache
      continue-on-error: true
      shell: pwsh
      run: |
        $sccacheExe = "$env:USERPROFILE\sccache\sccache.exe"
        if ((Test-Path $sccacheExe) -and (& $sccacheExe --show-stats 2>$null)) {
          Add-Content -Path $env:GITHUB_OUTPUT -Value "available=true"
          Write-Host "sccache is ready"
        } else {
          Add-Content -Path $env:GITHUB_OUTPUT -Value "available=false"
          Write-Host "WARNING: sccache not available"
        }
