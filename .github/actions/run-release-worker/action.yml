name: Run DL4J release worker
description: Bootstrap a release lane and execute one canonical shard variant.

inputs:
  shard:
    required: true
    description: Canonical release-plan shard id.
  variant:
    required: true
    description: Canonical release-plan variant name.
  build-threads:
    required: false
    default: ""
  maven-flags:
    required: false
    default: ""
  libnd4j-url:
    required: false
    default: ""
  build-aot:
    required: false
    default: "0"
  aot-all-spins:
    required: false
    default: "0"
  azure-cache-connection-string:
    required: false
    default: ""

outputs:
  artifact-root:
    description: Directory containing the staged Maven repository, SDK assets, and receipts.
    value: ${{ steps.worker.outputs.artifact-root }}
  release-version:
    description: Exact Maven version staged by this worker.
    value: ${{ steps.worker.outputs.release-version }}
  python-executable:
    description: Python executable selected by the worker bootstrap.
    value: ${{ steps.worker.outputs.python-executable }}

runs:
  using: composite
  steps:
    - name: Set up Java 11
      if: inputs.build-aot != '1'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "11"

    - name: Set up GraalVM for AOT
      if: inputs.build-aot == '1'
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: "17"
        distribution: graalvm
        github-token: ${{ github.token }}

    - name: Set up Python
      if: inputs.shard != 'linux-x86_64-compat'
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Bootstrap Unix worker
      if: runner.os != 'Windows'
      shell: bash
      run: |
        ndk=""
        case "${{ inputs.shard }}" in
          android-arm64|android-arm64-vulkan) ndk=r27d ;;
          android-x86_64) ndk=r26d ;;
        esac
        bash release/github/bootstrap-worker.sh "${{ inputs.shard }}" "$ndk"

    - name: Install pinned MSYS2 MinGW64 toolchain
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        # GitHub's Windows image already contains an initialized C:\\msys64.
        # Avoid downloading a fresh base archive: its first-boot pacman key
        # generation can hang before the worker ever starts.
        release: false
        update: true
        install: >-
          base-devel git tar pkg-config unzip p7zip zip autoconf autoconf-archive
          automake patch mingw-w64-x86_64-gnupg mingw-w64-x86_64-make
          mingw-w64-x86_64-cmake mingw-w64-x86_64-nasm
          mingw-w64-x86_64-toolchain mingw-w64-x86_64-libtool
          mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-fortran
          mingw-w64-x86_64-libwinpthread-git mingw-w64-x86_64-ragel

    - name: Bootstrap Windows worker
      if: runner.os == 'Windows'
      shell: powershell
      run: ./release/github/bootstrap-worker.ps1 -Shard '${{ inputs.shard }}'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ runner.os == 'Windows' && 'stable-x86_64-pc-windows-gnu' || 'stable' }}

    - name: Restore Maven dependency repository
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/dl4j-release-work/${{ inputs.shard }}/${{ inputs.variant }}/m2
        key: dl4j-maven-v2-${{ runner.os }}-${{ inputs.shard }}-${{ inputs.variant }}-${{ hashFiles('pom.xml', '**/pom.xml') }}
        restore-keys: |
          dl4j-maven-v2-${{ runner.os }}-${{ inputs.shard }}-
          dl4j-maven-v2-${{ runner.os }}-

    - name: Set up GitHub sccache fallback on Linux
      if: runner.os == 'Linux'
      continue-on-error: true
      uses: ./.github/actions/setup-sccache-linux
      with:
        cache-suffix: ${{ inputs.shard }}-${{ inputs.variant }}

    - name: Set up GitHub sccache fallback on Windows
      if: runner.os == 'Windows'
      continue-on-error: true
      uses: ./.github/actions/setup-sccache-windows
      with:
        cache-suffix: ${{ inputs.shard }}-${{ inputs.variant }}

    - name: Set up GitHub sccache fallback on macOS
      if: runner.os == 'macOS'
      continue-on-error: true
      uses: ./.github/actions/setup-sccache-macos
      with:
        cache-suffix: ${{ inputs.shard }}-${{ inputs.variant }}

    - name: Hand off pre-started sccache on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if command -v sccache >/dev/null 2>&1; then
          sccache --stop-server || true
        fi

    - name: Hand off pre-started sccache on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $sccache = Get-Command sccache -ErrorAction SilentlyContinue
        if ($null -ne $sccache) {
          & $sccache.Source --stop-server
        }
        exit 0

    - name: Execute shared release worker
      id: worker
      shell: bash
      env:
        INPUT_SHARD: ${{ inputs.shard }}
        INPUT_VARIANT: ${{ inputs.variant }}
        INPUT_BUILD_THREADS: ${{ inputs.build-threads }}
        INPUT_MAVEN_FLAGS: ${{ inputs.maven-flags }}
        INPUT_LIBND4J_URL: ${{ inputs.libnd4j-url }}
        INPUT_BUILD_AOT: ${{ inputs.build-aot }}
        INPUT_AOT_ALL_SPINS: ${{ inputs.aot-all-spins }}
        SCCACHE_AZURE_CONNECTION_STRING: ${{ inputs.azure-cache-connection-string }}
        DL4J_AZURE_CONNECTION_STRING: ${{ inputs.azure-cache-connection-string }}
        # The shared build driver uses these checked-in transports for the same
        # Azure dependency/toolchain archives that seed on Azure workers.
        DL4J_DEPENDENCY_CACHE_HELPER: ${{ github.workspace }}/release/azure/dependency-cache.py
        DL4J_CLOUD_IO: ${{ github.workspace }}/release/azure/cloud-io.py
      run: |
        set -Eeuo pipefail
        artifact_root="${GITHUB_WORKSPACE}/.release-worker/${INPUT_SHARD}/${INPUT_VARIANT}"
        work_root="${RUNNER_TEMP}/dl4j-release-work/${INPUT_SHARD}/${INPUT_VARIANT}"
        config="${artifact_root}/worker-config.json"
        printf 'artifact-root=%s\n' "${artifact_root}" >>"${GITHUB_OUTPUT}"
        args=(
          --source "${GITHUB_WORKSPACE}"
          --output "${config}"
          --shard "${INPUT_SHARD}"
          --variant "${INPUT_VARIANT}"
          --build-threads "${INPUT_BUILD_THREADS}"
          --maven-flags "${INPUT_MAVEN_FLAGS}"
          --libnd4j-url "${INPUT_LIBND4J_URL}"
          --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --commit "${GITHUB_SHA}"
        )
        [ "${INPUT_BUILD_AOT}" != 1 ] || args+=(--build-aot)
        [ "${INPUT_AOT_ALL_SPINS}" != 1 ] || args+=(--aot-all-spins)
        [ -z "${SCCACHE_AZURE_CONNECTION_STRING}" ] || args+=(--azure-cache)
        python_bin=""
        for candidate in python3.11 python3.10 python python3; do
          if command -v "${candidate}" >/dev/null 2>&1 &&
             "${candidate}" -c 'import sys; raise SystemExit(sys.version_info < (3, 10))'; then
            python_bin=$(command -v "${candidate}")
            break
          fi
        done
        if [ -z "${python_bin}" ]; then
          printf 'The release worker requires Python 3.10 or newer.\n' >&2
          exit 1
        fi
        printf 'python-executable=%s\n' "${python_bin}" >>"${GITHUB_OUTPUT}"
        "${python_bin}" release/github/prepare-worker.py config "${args[@]}"
        release_version=$("${python_bin}" -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseVersion"])' "${config}")
        printf 'release-version=%s\n' "${release_version}" >>"${GITHUB_OUTPUT}"

        export DL4J_SCCACHE_DIR="${RUNNER_TEMP}/dl4j-sccache/${INPUT_SHARD}/${INPUT_VARIANT}"
        "${python_bin}" release/aws/build-platform.py \
          --config "${config}" \
          --source "${GITHUB_WORKSPACE}" \
          --repository "${work_root}/m2" \
          --maven-output "${artifact_root}/maven-repository" \
          --sdk-output "${artifact_root}/sdk-assets"
        printf 'success\n' >"${artifact_root}/worker-success"

    - name: Keep only third-party Maven dependencies in cache
      if: always()
      shell: bash
      run: |
        maven_cache="${RUNNER_TEMP}/dl4j-release-work/${{ inputs.shard }}/${{ inputs.variant }}/m2"
        rm -rf -- "${maven_cache}/org/eclipse/deeplearning4j" "${maven_cache}/org/nd4j"
