name: Setup sccache for Linux
description: 'Install and configure sccache with GitHub Actions cache backend for distributed per-object caching'

inputs:
  cache-suffix:
    description: 'Suffix for sccache GHA version key (e.g., cuda-12.6). Used to partition cache namespaces.'
    required: false
    default: ''

outputs:
  sccache-available:
    description: 'Whether sccache was successfully set up'
    value: ${{ steps.verify-sccache.outputs.available }}

runs:
  using: composite
  steps:
    - name: Install sccache
      shell: bash
      run: |
        SCCACHE_VERSION="v0.10.0"
        SCCACHE_FILE="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
        SCCACHE_URL="https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${SCCACHE_FILE}.tar.gz"
        echo "Downloading sccache ${SCCACHE_VERSION}..."
        curl -fsSL "${SCCACHE_URL}" | tar xz -C /tmp
        sudo mv "/tmp/${SCCACHE_FILE}/sccache" /usr/local/bin/sccache
        chmod +x /usr/local/bin/sccache
        echo "Installed sccache:"
        sccache --version

    - name: Configure sccache GHA backend
      uses: actions/github-script@v7
      with:
        script: |
          // Expose the GitHub Actions cache API tokens to sccache.
          // These are provided by the runner but not normally available as env vars.
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Set sccache environment
      shell: bash
      run: |
        # Enable GitHub Actions cache backend
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

        # Partition cache by suffix to prevent cross-contamination between
        # CUDA versions, platforms, etc. Changing this value purges the cache.
        SUFFIX=$(echo "${{ inputs.cache-suffix }}" | sed 's/-*$//')
        if [ -n "$SUFFIX" ]; then
          echo "SCCACHE_GHA_VERSION=${SUFFIX}" >> $GITHUB_ENV
        fi

        # sccache as the compiler launcher for CMake
        echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
        echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
        echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV

        # Tell downstream CMake that sccache is available (skip ccache setup)
        echo "SD_USE_SCCACHE=1" >> $GITHUB_ENV

        # Disable PCH: CI runners have different system header mtimes across restores
        echo "SD_DISABLE_PCH=1" >> $GITHUB_ENV

        # Start sccache server
        sccache --start-server || true
        echo "=== sccache configuration ==="
        sccache --show-stats

    - name: Verify sccache
      id: verify-sccache
      shell: bash
      run: |
        if command -v sccache &>/dev/null && sccache --show-stats &>/dev/null; then
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "sccache is ready"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "WARNING: sccache not available, build will proceed without distributed caching"
        fi
