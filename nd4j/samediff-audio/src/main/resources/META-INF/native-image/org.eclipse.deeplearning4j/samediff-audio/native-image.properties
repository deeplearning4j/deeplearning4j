# Native Image configuration for samediff-audio (see ADR 0109).
#
# AudioLoader uses javax.sound.sampled.AudioSystem which calls AudioSystem.getMixerInfo()
# at class-init time on some JVMs — defer the entire audio I/O package to run-time.
# WhisperModelDownloader calls System.getProperty("user.home") at static-init time;
# defer it to run-time as well.
# WhisperConfig static factory methods are safe (pure data), but the @Data/@Builder
# Lombok-generated classes carry no unsafe statics so they need no run-time deferral —
# only reflection registration (see reflect-config.json).
Args = --initialize-at-run-time=org.eclipse.deeplearning4j.audio.io \
       --initialize-at-run-time=org.eclipse.deeplearning4j.audio.feature \
       --initialize-at-run-time=org.eclipse.deeplearning4j.audio.transform \
       --initialize-at-run-time=org.eclipse.deeplearning4j.audio.whisper.WhisperModelDownloader \
       --initialize-at-run-time=org.eclipse.deeplearning4j.audio.whisper.WhisperModel \
       --initialize-at-run-time=org.eclipse.deeplearning4j.audio.whisper.WhisperMelSpectrogram \
       --initialize-at-run-time=org.eclipse.deeplearning4j.audio.training
