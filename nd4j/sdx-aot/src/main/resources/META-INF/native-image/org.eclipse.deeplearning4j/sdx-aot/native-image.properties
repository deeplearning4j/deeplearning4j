# Native-image configuration for the SDX AOT images (sdx-llm CLI + libsdx_llm).
#
# Consolidates the flag set proven by the graalvm-native-image-example build
# (ADR 0099) and adds the LLM-stack specifics (tokenizers-native, samediff-llm).
# The nd4j-api / nd4j-common / nd4j-native / tokenizers-native jars contribute
# their own META-INF/native-image configs on top of this file — duplication of
# the runtime-init list here keeps this module buildable against older snapshots.
Args = --no-fallback \
       -H:+JNI \
       -H:+AddAllCharsets \
       -H:+ReportExceptionStackTraces \
       -H:ExcludeResources=.*\.so$ \
       -H:ExcludeResources=.*\.so\..* \
       -H:ExcludeResources=.*\.dylib$ \
       -H:ExcludeResources=.*\.dll$ \
       -H:ExcludeResources=.*\.a$ \
       -H:ExcludeResources=.*\.lib$ \
       --initialize-at-build-time=org.slf4j,ch.qos.logback,org.eclipse.deeplearning4j.sdx.aot.SdxNativeLibs \
       --enable-url-protocols=http,https,file \
       --initialize-at-run-time=org.nd4j.nativeblas.NativeOpsHolder \
       --initialize-at-run-time=org.nd4j.imports.converters.DifferentialFunctionClassHolder \
       --initialize-at-run-time=org.nd4j.linalg.factory.Nd4j \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.Raw \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.FloatRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.HalfRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.IntRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.ShortRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.CharRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.BooleanRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.DoubleRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.UByteRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.ULongRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.UShortRawIndexer \
       --initialize-at-run-time=org.bytedeco.javacpp.indexer.UnsafeRaw \
       --initialize-at-run-time=org.nd4j.common.config.ND4JClassLoading \
       --initialize-at-run-time=org.nd4j.linalg.cpu.nativecpu.bindings.Nd4jCpu \
       --initialize-at-run-time=org.bytedeco.javacpp.Loader \
       --initialize-at-run-time=org.bytedeco.javacpp.Pointer \
       --initialize-at-run-time=org.nd4j.linalg.cpu.nativecpu.ops.NativeOpExecutioner \
       --initialize-at-run-time=org.eclipse.deeplearning4j.tokenizers \
       --initialize-at-run-time=org.eclipse.deeplearning4j.llm.tokenizer
# Resource bundling deliberately lives in JSON configs, not -H:IncludeResources args:
# properties-file -H: args are experimental/unreliable, while the resource-config.json
# channel is what actually bundled every working resource (nd4j-native .so via its
# resource-config, nd4j-api root pbtxt/properties via its resource-config, tokenizers
# .so via JavaCPP's generated config, logback.xml via this module's resource-config).
