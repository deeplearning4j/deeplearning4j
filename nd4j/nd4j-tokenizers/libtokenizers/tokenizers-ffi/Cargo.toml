[package]
name = "tokenizers-ffi"
version = "0.1.0"
edition = "2021"
authors = ["Eclipse Deeplearning4j Contributors"]
license = "Apache-2.0"
description = "C FFI bindings for HuggingFace tokenizers library"

[lib]
name = "tokenizers_ffi"
crate-type = ["cdylib", "staticlib"]

[features]
default = ["onig-regex"]
onig-regex = ["tokenizers/onig"]
# Pure-Rust regex avoids libonig/clang cross-builds and is suitable for Android/iOS.
portable-regex = ["tokenizers/fancy-regex"]

[dependencies]
tokenizers = { version = "0.21", default-features = false }
libc = "0.2"

[build-dependencies]
cbindgen = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
