# Native Image configuration for samediff-vlm (ADR 0109 — SDX AOT, vlm phase).
#
# samediff-vlm depends on:
#   - javacv (optional — video only; not used in the SDX image path; mark runtime-init
#     so the binding classes are never clinit'd at build time regardless)
#   - ffmpeg  (optional native, same reason)
#   - Apache PDFBox (pdf rendering — loaded via reflection from SdxVlm; clinit needs
#     a real AWT/font environment, so defer to run time)
#   - javax.imageio ImageIO (standard JDK — no special treatment needed)
#
# javacv / ffmpeg touch native libraries in their static initializers (Loader.load()).
# If allowed to clinit at image-build time they crash the build. Mark entire packages
# as run-time-init so graal never touches them during the static analysis / clinit phase.
Args = --initialize-at-run-time=org.bytedeco.javacv \
       --initialize-at-run-time=org.bytedeco.ffmpeg \
       --initialize-at-run-time=org.apache.pdfbox
