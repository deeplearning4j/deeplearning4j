# ND4J Metal Backend Configuration
# Apple Silicon (macOS arm64) — Metal GPU via MLX + MPS + Metal ICB replay

# NDArray implementation
real.class.double = org.nd4j.linalg.api.ndarray.BaseNDArray

# Default data type — float16 is efficient on Apple Silicon; float32 is safer for gradients
dtype = float

# Array ordering (row-major, matching MLX default)
ndarray.order = c

# Device type for multi-backend routing
device.type = METAL

# Native operations bridge (generated by JavaCPP from nd4j-metal-preset)
# Uncomment when bindings are generated:
# native.ops = org.nd4j.linalg.metal.bindings.Nd4jMetal

# NDArray factory (placeholder until Metal-specific factory is implemented)
# ndarrayfactory.class = org.nd4j.linalg.metal.JMetalNDArrayFactory

# Metal/MLX-specific settings
metal.mlx.enabled = true
metal.icb.replay.enabled = true
metal.icb.max.commands = 256
metal.unified.memory = true

# MPS per-op helper path (gap ops not fused into MLX graph islands)
metal.mps.enabled = true

# MLX graph fusion — island size tuning (see island policy design in ADR)
metal.mlx.island.max.slots = 64
metal.mlx.island.min.slots = 2
