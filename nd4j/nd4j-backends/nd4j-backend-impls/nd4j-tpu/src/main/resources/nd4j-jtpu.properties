# ND4J TPU Backend Configuration
# Uses PJRT (Portable Runtime) for Google Cloud TPU support

# NDArray implementation
real.class.double = org.nd4j.linalg.api.ndarray.BaseNDArray

# Default data type - bfloat16 is native on TPU
dtype = bfloat16

# Array ordering
ndarray.order = c

# Native operations bridge (to be generated by JavaCPP)
# native.ops = org.nd4j.linalg.jtpu.bindings.Nd4jTpu

# NDArray factory
# ndarrayfactory.class = org.nd4j.linalg.jtpu.JTpuNDArrayFactory

# Data buffer factory
# databufferfactory = org.nd4j.linalg.jtpu.buffer.TpuDataBufferFactory

# Memory manager
# memorymanager = org.nd4j.linalg.jtpu.memory.TpuMemoryManager

# Affinity manager for multi-TPU support
# affinitymanager = org.nd4j.linalg.jtpu.concurrency.TpuAffinityManager

# Operation executor
# opexec = org.nd4j.linalg.jtpu.ops.TpuExecutioner
# opexec.mode = native

# TPU-specific settings
tpu.prefer.bfloat16 = true
tpu.hlo.cache.enabled = true
tpu.hlo.cache.size = 1000
