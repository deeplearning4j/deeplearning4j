# ND4J Cloud TPU backend: host-native control plane + StableHLO/PJRT DSP.
real.class.double = org.nd4j.linalg.cpu.nativecpu.NDArray
shapeinfoprovider = org.nd4j.jita.constant.ProtectedCachedShapeInfoProvider
constantsprovider = org.nd4j.linalg.cpu.nativecpu.cache.ConstantBuffersCache
affinitymanager = org.nd4j.linalg.jtpu.TpuAffinityManager
memorymanager = org.nd4j.linalg.cpu.nativecpu.CpuMemoryManager

# BF16 remains explicitly available, but FLOAT is the safe public API default.
dtype = float
blas.ops = org.nd4j.linalg.cpu.nativecpu.BlasWrapper
native.ops = org.nd4j.linalg.jtpu.bindings.Nd4jTpu
ndarrayfactory.class = org.nd4j.linalg.cpu.nativecpu.CpuNDArrayFactory
ndarray.order = c
resourcemanager_state = false
databufferfactory = org.nd4j.linalg.cpu.nativecpu.buffer.DefaultDataBufferFactory
workspacemanager = org.nd4j.linalg.cpu.nativecpu.workspace.CpuWorkspaceManager
alloc = javacpp
device.type = TPU
opexec = org.nd4j.linalg.jtpu.ops.TpuExecutioner
opexec.mode = native
random = org.nd4j.linalg.cpu.nativecpu.rng.CpuNativeRandom
blaslapackdelegator = org.nd4j.linalg.cpu.nativecpu.OpenblasLapackDelegator
statsprovider = org.nd4j.linalg.jtpu.TpuStatisticsProvider
deviceidprovider = org.nd4j.jita.constant.DefaultDeviceIDProvider
