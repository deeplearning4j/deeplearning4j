# Native image configuration for ND4J CUDA backend (nd4j-cuda-12.9)
# Mirrors the proven kompile production configuration (NativeProfileBuilder.addRuntimeInitArgs).
#
# KEY RULE: --initialize-at-run-time prevents points-to-analysis hang on
# DifferentialFunctionClassHolder and all JNI/native-loading code.
# The full org.nd4j.linalg.jcublas,org.nd4j.jita package sweep defers every
# CUDA backend class to runtime so GraalVM does not try to statically initialise
# CUDA device enumeration during image build.
#
# NOTE: -H:IncludeResources / -H:ExcludeResources are NOT applied from
# native-image.properties files in dependency jars (campaign-proven limitation).
# Those flags belong in the top-level pom.xml buildArgs of the consuming module
# (sdx-aot/pom.xml already carries them).
Args = --initialize-at-run-time=org.nd4j.linalg.jcublas \
       --initialize-at-run-time=org.nd4j.jita \
       --initialize-at-run-time=org.nd4j.presets.cuda \
       --initialize-at-run-time=org.bytedeco.cuda \
       --initialize-at-run-time=org.bytedeco.javacpp.Loader \
       --initialize-at-run-time=org.bytedeco.javacpp.Pointer \
       -H:+JNI \
       -H:+ReportExceptionStackTraces \
       --enable-url-protocols=http,https,file
