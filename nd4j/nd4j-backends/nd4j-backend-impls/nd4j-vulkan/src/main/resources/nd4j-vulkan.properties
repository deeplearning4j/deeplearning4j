# ND4J Vulkan Backend Configuration
# Vulkan is a native device backend. Graphs and eager operations execute through
# the descriptor-driven Vulkan native-plan path. Operation admission and lowering
# are owned by the native catalog; there is no Java-side allow-list or CPU fallback.

# NDArray implementation
real.class.double = org.nd4j.linalg.vulkan.VulkanNDArray
shapeinfoprovider = org.nd4j.jita.constant.ProtectedCachedShapeInfoProvider

# Default data type
dtype = float

# Array ordering
ndarray.order = c

# Device type for multi-backend routing (named token, not generic GPU — the
# generic value collides with CUDA detection in Nd4j initialization)
device.type = VULKAN

# Native runtime binding generated from the shared NativeOps API, matching the
# CUDA backend pattern with a Vulkan library identity.
native.ops = org.nd4j.linalg.vulkan.bindings.Nd4jVulkan

# ---------------------------------------------------------------------------
# P4 Java layer (ADR-0112 §1) — keys flipped from cpu.nativecpu.* to
# Vulkan-specific implementations (one key per change, each with its test).
# ---------------------------------------------------------------------------

# FLIPPED (Step 1): VulkanAffinityManager — thread-to-device binding via
# NativeOps.setDevice/getDevice; device count from NativeOps.getAvailableDevices.
# No UVA assumptions; cross-device transfers always explicit (ADR-0111 §6).
affinitymanager = org.nd4j.linalg.vulkan.VulkanAffinityManager

# FLIPPED (Step 2): VulkanMemoryManager — DEVICE alloc via NativeOps.mallocDevice;
# fence-deferred frees handled in native VulkanMemoryPool (ADR-0111 §3 / §9).
memorymanager = org.nd4j.linalg.vulkan.VulkanMemoryManager

# FLIPPED (Step 3): VulkanDeviceIDProvider — thread-local Vulkan device ID from
# the AffinityManager; mirrors CudaDeviceIdProvider pattern.
deviceidprovider = org.nd4j.linalg.vulkan.VulkanDeviceIDProvider

# VulkanWorkspaceManager follows the CUDA workspace boundary via
# BasicWorkspaceManager + VulkanWorkspace. Host memory is the staging/mirroring
# plane; DEVICE allocations are reusable VulkanMemoryPool tokens owned by the
# workspace and are never substituted with host allocations.
workspacemanager = org.nd4j.linalg.vulkan.VulkanWorkspaceManager

# VulkanDataBufferFactory creates VulkanDataBuffer instances directly. The
# Java buffer owns the framework datatype/indexer boundary while OpaqueDataBuffer
# owns the native primary/special state machine.
databufferfactory = org.nd4j.linalg.vulkan.VulkanDataBufferFactory

# VulkanNDArrayFactory follows the CUDA device boundary: it extends the shared
# BaseNativeNDArrayFactory and constructs VulkanNDArray instances. It does not
# inherit CPU array-factory behavior.
ndarrayfactory.class = org.nd4j.linalg.vulkan.VulkanNDArrayFactory

# Vulkan-owned native services. These mirror CUDA's backend boundary: native
# shape/context/constant metadata is available, while direct eager operations
# without a Vulkan device path fail instead of invoking host kernels.
constantsprovider = org.nd4j.linalg.vulkan.cache.VulkanConstantHandler
opexec = org.nd4j.linalg.vulkan.ops.executioner.VulkanExecutioner
opexec.mode = native
random = org.nd4j.linalg.vulkan.rng.VulkanNativeRandom
blas.ops = org.nd4j.linalg.vulkan.VulkanBlasWrapper
# Level-1/2/3 BLAS and LAPACK are implemented by Vulkan-owned backend paths.
# They use the same INDArray/device ownership contract and do not select a host
# vendor library or require a second CPU backend.
statsprovider = org.nd4j.linalg.vulkan.VulkanStatisticsProvider
alloc = javacpp

# Vulkan-specific settings
vulkan.version = 1.2
vulkan.command.buffer.replay = true
