# Native Image configuration for samediff-llm (see ADR 0099 / ADR 0109).
# The HuggingFace tokenizer wrapper touches the tokenizers-native JavaCPP bindings —
# defer it (and the native binding package) to runtime init so no native library is
# loaded during image build.
Args = --initialize-at-run-time=org.eclipse.deeplearning4j.llm.tokenizer \
       --initialize-at-run-time=org.eclipse.deeplearning4j.tokenizers
