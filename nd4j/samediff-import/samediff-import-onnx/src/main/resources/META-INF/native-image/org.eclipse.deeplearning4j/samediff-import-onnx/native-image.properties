# Native Image configuration for samediff-import-onnx (ADR 0109 — SDX AOT).
#
# The ONNX importer is driven at runtime (model load time): OnnxFrameworkImporter
# parses ONNX protobuf messages and constructs SameDiff graphs. None of the ONNX
# parsing can happen at image-build time (it requires the model file on disk).
#
# Key runtime-init requirements:
#   - OnnxFrameworkImporter initialises onnx mapping rule tables from classpath
#     .pbtxt resources via static field init; defer to runtime so the correct
#     classpath is visible.
#   - Kotlin companion objects in org.nd4j.samediff.frameworkimport.onnx.*
#     sometimes initialise via static delegate fields at first access; deferring
#     the whole package is safe and avoids subtle build-time ordering issues.
Args = --initialize-at-run-time=org.nd4j.samediff.frameworkimport.onnx
