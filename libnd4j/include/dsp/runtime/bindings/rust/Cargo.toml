[package]
name = "sdx-runtime"
version = "0.0.1"
edition = "2021"
description = "Rust wrapper for the SDX runtime C ABI"
license = "Apache-2.0"

[lib]
name = "sdx_runtime"
path = "src/lib.rs"

[features]
default = []
cuda = []
amd = []
# Link the JVM-free standalone runtime (libsdx_cpu / libsdx_cuda) instead of
# the monolithic libnd4j* backend library.
standalone = []
# Enable zero-copy ndarray interop: exposes Context::run_named() which accepts
# ArrayViewD<f32> inputs and returns Vec<ArrayD<f32>> outputs.
ndarray = ["dep:ndarray"]

[dependencies]
ndarray = { version = "0.16", optional = true }
